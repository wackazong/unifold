# yaml-language-server: $schema=https://youmedoc.example/0.1/manifest.schema.json
# Manifest of the unit. Delete what is empty; 'wiring' only if the unit has children.
unit: <folder-name>
summary: <what the unit is, one line, no full stop>
# youmedoc: "0.1"          # root unit only
# level: core              # root unit only: follow only the core rules
# diagram-links: none      # root unit only: none | relative | base URL of the file view
# ignore: [third-party]    # root unit only: folders that are not scanned
kind: <kind>
status: planned
owner: <team or person>
provides:
  <port-name>:
    kind: <kind>
    summary: <what the port offers, one line>
    contract: doc/references/<port-name>.md
    # verified-by: <path to the tests of this port, once they exist>
    # conforms-to: <need-name>   # if the port implements a definition received through a need
needs:
  <need-name>:
    kind: <kind>
    summary: <what this unit expects from whoever provides it, one line>
    # contract: doc/references/<need-name>.md   # if this unit defines the interface it expects
wiring:
  <child>.<need>: <child>.<port>
  <child>.<need>: {<default>: <child>.<port>, <alternative>: <child>.<port>}
  "*.<need>": <child>.<port>     # every child that has this need
