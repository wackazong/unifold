responsibility: Implements the BLE profile on top of the radio
kind: library
status: planned
secret:
  what: how the procedures of the profile are served from the log and the radio
  decision: docs/decisions/0001-serve-a-fetch-from-the-log-on-demand.md
not:
  - measuring; link serves what it is given: live-readings
  - storing readings: reading-log
  - the role of a central; link never scans and never connects
  - deciding what the profile should say
  - anything a central does with a reading
capabilities:
  ble-link:
    kind: protocol
    summary: Serves live and stored readings to a nearby central over BLE
    contract: ../../docs/references/ble-profile/index.md
needs:
  radio:
    kind: library
    summary: BLE peripheral role with GATT server primitives
    contract: ../docs/references/radio.md
  reading-log:
    kind: library
    summary: Stored readings in order, with a way to mark them as delivered
    contract: ../docs/references/reading-log.md
  live-readings:
    kind: library
    summary: The newest reading as soon as it exists
    contract: ../docs/references/readings.md
