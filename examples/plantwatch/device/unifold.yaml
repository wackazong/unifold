responsibility: Firmware of the sensor stick that measures soil and surroundings and serves the readings over BLE
kind: stateful
runs-as: firmware
status: planned
not:
  - wall-clock time; the firmware counts ticks and never knows the date
  - judging a reading; the firmware knows no plant and no threshold
  - any radio other than BLE, and the role of a central
  - updating itself
capabilities:
  ble-link:
needs:
  soil-probe:
  ambient-sensor:
wiring:
  ble-link: link.ble-link
  sampling.sensor-io: hal.sensor-io
  sampling.timer: hal.timer
  store.flash: hal.flash
  store.readings: sampling.readings
  link.radio: hal.radio
  link.reading-log: store.reading-log
  link.live-readings: sampling.readings
  hal.ambient-sensor: ambient-sensor
  hal.soil-probe: soil-probe
scenarios:
  take-a-reading:
    summary: The sensor stick wakes at the sampling time, takes a reading, stores it and sleeps again
    source: runtime of device, the sleep and wake cycle
    given:
      - sampling.readings: subscribed
    hops:
      - hal -> sampling.alarm
      - sampling -> hal.ticks(): 12 / 86405
      - sampling -> hal.measure(): three raw values
      - hal -> soil-probe.output(): a share of the supply
      - hal -> ambient-sensor.read(): both values within 150 ms
      - sampling -> store.new-reading(reading 3145825)
      - store -> hal.write(the slot of 3145825): ok
      - sampling -> link.new-reading(reading 3145825)
      - link -> hal.send(Live reading, the record of 3145825): ok
      - link -> hal.send(Status, the counters with 3145825 as the newest reading): ok
      - sampling -> hal.set-alarm(at second 87305): ok
    expect: one reading with the next sequence number and the tick count of the measurement is in the log and survives power loss; a connected central is notified of it as Live reading and of the new Status; the board sleeps until the next alarm
  serve-a-fetch:
    summary: A central opens a session, fetches the 96 stored readings and confirms them
    source: BLE profile, fetch stored readings and confirm
    hops:
      - ble-link -> link.open-session(): ok
      - link -> hal.answer(7, value(18 bytes)): ok
      - ble-link -> link.status(): 0C 00 09 55 01 00 67 12 00 00 C6 12 00 00 60 00 00
      - ble-link -> link.fetch(01 00 00 00 00 C8 00): 96 records, then 80 01 00 60 00 C6 12 00 00 00
      - repeat:
          times: 96
          hops:
            - link -> store.read(the number after the last record sent, 0 first): the next stored reading, 4711 first
            - link -> hal.send(Transfer data, the record): ok
      - ble-link -> link.confirm(02 C6 12 00 00): 80 02 00 00 00 00 00 00 00
      - link -> store.mark-delivered(4806): ok
    expect: the central receives the readings 4711 to 4806 in ascending order, exactly as the log holds them; the confirm result goes out only after the mark is durable, and the readings up to 4806 are no longer stored
