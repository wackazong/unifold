responsibility: Hardware abstraction of the sensor stick board
kind: adapter
status: planned
secret:
  what: the board, its pins, its peripherals and the radio stack of its vendor
  decision: ../docs/decisions/0002-only-one-part-touches-the-hardware.md
not:
  - converting raw values to percent, lux or degrees
  - deciding when to measure, what to keep and what to send
  - the meaning of GATT attributes and the layout of data in the blocks
  - measuring the cell voltage for others; no capability provides it
  - replacing the program of the board over the radio
capabilities:
  sensor-io:
    kind: library
    summary: Raw values from the soil probe and the ambient sensor, on request
    contract: ../docs/references/sensor-io.md
  radio:
    kind: library
    summary: BLE peripheral role - advertise, accept a connection, exchange GATT data
    contract: ../docs/references/radio.md
  flash:
    kind: library
    summary: Read, write and erase blocks of memory that survive power loss
    contract: ../docs/references/flash.md
  timer:
    kind: library
    summary: Wake-up timers and a tick counter that keeps running in deep sleep
    contract: ../docs/references/timer.md
needs:
  soil-probe:
    kind: hardware
    summary: Analogue voltage that falls as the soil gets wetter
    contract: ../../docs/references/soil-probe.md
  ambient-sensor:
    kind: hardware
    summary: Light and temperature sensor on an I2C bus
    contract: ../../docs/references/ambient-sensor.md
