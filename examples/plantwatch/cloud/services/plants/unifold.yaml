responsibility: Registry of plants with their sensors, thresholds and reading history
kind: service
status: planned
secret:
  what: how the history of a plant is stored and aggregated
  decision: docs/decisions/0001-raw-readings-for-90-days-hourly-aggregates-for-2-years.md
not:
  - accepting or validating uploaded readings
  - deciding whether a plant needs attention; plants stores thresholds and compares nothing with them
  - threshold presets and plant species
  - knowing owners beyond their identifier; plants trusts the owner id it is given
  - telling anybody that a plant changed; others ask when they need to know
capabilities:
  plants-api:
    kind: http
    summary: Plants with their sensors, thresholds and history
    contract: ../../docs/references/plants-api.md
needs:
  reading-events:
    kind: events
    summary: One event per accepted reading, at least once, to build the history of each plant
    contract: ../../docs/references/reading-events.md
  sql-db:
    kind: db
    summary: A schema of its own in a relational database with transactions
    contract: ../../docs/references/sql-db.md
  event-bus:
    kind: queue
    summary: A durable subscription that delivers again what was not confirmed
    contract: ../../docs/references/event-bus.md
