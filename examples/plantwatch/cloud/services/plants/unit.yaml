unit: plants
summary: Registry of plants with their sensors, thresholds and reading history
kind: service
status: planned
provides:
  plants-api:
    kind: http
    summary: Plants with their sensors, thresholds and history
    contract: doc/references/plants-api.md
needs:
  reading-events:
    kind: events
    summary: One event per accepted reading, at least once, to build the history of each plant
    contract: doc/references/reading-events.md
  sql-db:
    kind: db
    summary: A schema of its own in a relational database with transactions
  event-bus:
    kind: queue
    summary: A durable subscription that delivers again what was not confirmed
