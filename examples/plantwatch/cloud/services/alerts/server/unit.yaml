unit: server
summary: Process that consumes readings, stores the alerts they lead to and answers queries about them
kind: app
status: planned
provides:
  alerts-api:
    kind: http
    summary: Open and past alerts per plant
needs:
  reading-events:
    kind: events
    summary: One event per accepted reading, at least once, in order of acceptance per sensor stick
    contract: doc/references/reading-events.md
  evaluation:
    kind: library
    summary: Decides for a reading which alerts open and close, and returns what to remember
    contract: doc/references/evaluation.md
  notification:
    kind: library
    summary: Tells the owner about an opened alert and may be called again for the same alert
    contract: doc/references/notification.md
  sql-db:
    kind: db
    summary: A schema of its own in a relational database with transactions and row locks
  event-bus:
    kind: queue
    summary: A durable subscription that keeps the order per key and delivers again what was not confirmed
