responsibility: Turns an opened alert into one notification to the owner
kind: adapter
status: planned
secret:
  what: how one notification per alert is achieved towards the push service
  decision: docs/decisions/0001-once-means-repeatable-with-a-collapse-identifier.md
not:
  - deciding whether or when to notify; notifier notifies when it is called
  - repeating a failed attempt by itself
  - remembering which alerts were notified
  - registering phones or knowing which phones an owner has: push
  - notifying about anything but an opened alert; no reminders, no "alert closed"
  - languages other than English
capabilities:
  notification:
    kind: library
    summary: Hands the notification for an opened alert to the push service; a repeated call shows no second one
    contract: ../docs/references/notification.md
needs:
  push:
    kind: http
    summary: Takes one notification for an owner, with a collapse identifier, and delivers it to that owner's phones
    contract: ../../../../docs/references/push-service.md
