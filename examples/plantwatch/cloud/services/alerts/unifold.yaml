responsibility: Decides when a plant needs attention and notifies its owner once
kind: service
status: planned
not:
  - storing thresholds or plants; alerts asks for them: plants-api
  - storing readings or history
  - reminders; an alert that stays open sends nothing more
  - alerts about missing data, such as a sensor stick that has gone silent
  - acknowledging or closing an alert by hand
  - choosing which phones get a notification: push
capabilities:
  alerts-api:
    kind: http
    summary: Open and past alerts per plant
    contract: ../../docs/references/alerts-api.md
needs:
  reading-events:
    kind: events
    summary: One event per accepted reading, at least once, in order of acceptance per sensor stick
    contract: ../../docs/references/reading-events.md
  plants-api:
    kind: http
    summary: An HTTP lookup that returns the plant a sensor stick is attached to, with owner and thresholds
    contract: ../../docs/references/plants-api.md
  push:
    kind: http
    summary: Takes one notification for an owner, with a collapse identifier, and delivers it to that owner's phones
    contract: ../../../docs/references/push-service.md
  sql-db:
    kind: db
    summary: A schema of its own in a relational database with transactions and row locks
    contract: ../../docs/references/sql-db.md
  event-bus:
    kind: queue
    summary: A durable subscription that keeps the order per key and delivers again what was not confirmed
    contract: ../../docs/references/event-bus.md
wiring:
  alerts-api: server.alerts-api
  server.evaluation: rules.evaluation
  server.notification: notifier.notification
  rules.thresholds: plant-lookup.thresholds
  notifier.push: push
  plant-lookup.plants-api: plants-api
  server.event-bus: event-bus
  server.reading-events: reading-events
  server.sql-db: sql-db
scenarios:
  handle-a-reading:
    summary: One reading event is judged, the alerts it causes are stored, and an opened alert is notified
    source: decisions 0001 and 0002 of alerts
    hops:
      - server -> event-bus.deliver
      - server -> reading-events.reading-accepted
      - server -> sql-db.transaction
      - server -> rules.evaluate
      - rules -> plant-lookup.lookup
      - plant-lookup -> plants-api.lookup-by-sensor
      - server -> event-bus.commit
      - server -> notifier.notify
      - notifier -> push.send
    expect: the alerts to open and close and the new evaluation state are stored in one transaction, then the event is confirmed; for an opened alert one notification is handed to the push service and the alert's notification becomes `sent`, also after a restart, since the delivery step is not tied to the event
