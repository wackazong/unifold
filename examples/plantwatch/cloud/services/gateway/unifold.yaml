responsibility: Single entry point of the server side that authenticates callers and routes requests
kind: service
status: planned
secret:
  what: the form and the verification of tokens
  decision: docs/decisions/0001-self-contained-signed-tokens.md
not:
  - looking into, validating or changing a body
  - combining the answers of several providers into one response
  - storing anything; no sessions, no owners, no request log beyond the process log
  - terminating TLS; whoever publishes the network port of gateway does that
  - deciding what an owner may see; each provider limits its answers to the owner it is told
capabilities:
  public-api:
    kind: http
    summary: Upload readings and query plants, history and alerts
    contract: ../../../docs/references/public-api/index.md
needs:
  ingest-api:
    kind: http
    summary: Serves the upload of a batch of readings as the public API defines it
    contract: ../../docs/references/ingest-api.md
  plants-api:
    kind: http
    summary: Serves the operations on plants and history as the public API defines them
    contract: ../../docs/references/plants-api.md
  alerts-api:
    kind: http
    summary: Serves the operations on alerts as the public API defines them
    contract: ../../docs/references/alerts-api.md
