responsibility: Accepts uploaded readings and announces each accepted one as an event
kind: service
status: planned
secret:
  what: how a reading that was accepted before is recognised
  decision: docs/decisions/0001-accepted-ranges-are-kept-on-the-event-bus.md
not:
  - storing readings for queries
  - knowing which plant a sensor stick belongs to, or who owns it
  - verifying tokens; ingest trusts the caller identity it is given
  - judging a reading against thresholds
  - correcting a reading, or replacing an accepted one
capabilities:
  ingest-api:
    kind: http
    summary: Accepts a batch of readings of one sensor and says which ones were new
    contract: ../../docs/references/ingest-api.md
  reading-events:
    kind: events
    summary: One event per accepted reading, keyed by sensor id, in order of acceptance, at least once
    contract: ../../docs/references/reading-events.md
needs:
  event-bus:
    kind: queue
    summary: Stores each event durably before it acknowledges it and keeps it for later subscribers
    contract: ../../docs/references/event-bus.md
