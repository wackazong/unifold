responsibility: Server side that turns uploaded readings into plant history and alerts
kind: stateful
runs-as: process
status: planned
not:
  - talking to a sensor stick; readings arrive only through the public API
  - assigning or correcting the time of a reading; cloud trusts the time a reading carries
  - changing or deleting a single reading
  - user accounts with passwords, recovery or sharing; an owner is whoever holds a token of that owner
  - threshold presets and knowledge about plant species
  - delivering a notification to a phone; the need `push-service` does that
capabilities:
  public-api:
needs:
  push-service:
    summary: Takes a notification for an owner and delivers it to the phones registered for that owner
    contract: ../docs/references/push-service.md
  container-host:
wiring:
  ingest.event-bus: platform.event-bus
  plants.event-bus: platform.event-bus
  alerts.event-bus: platform.event-bus
  plants.sql-db: platform.sql-db
  alerts.sql-db: platform.sql-db
  public-api: gateway.public-api
  gateway.ingest-api: ingest.ingest-api
  gateway.plants-api: plants.plants-api
  gateway.alerts-api: alerts.alerts-api
  plants.reading-events: ingest.reading-events
  alerts.reading-events: ingest.reading-events
  alerts.plants-api: plants.plants-api
  alerts.push: push-service
  platform.container-host: container-host
  gateway.container-host: container-host
scenarios:
  upload-leads-to-alert:
    summary: A client sets a threshold and uploads a reading below it; the server opens an alert and answers the queries that follow
    source: decisions 0001 and 0003 of cloud
    hops:
      - public-api -> services/gateway.get-plant: P → 200 with the plant
      - services/gateway -> services/plants.get-plant: P → 200 with the plant
      - public-api -> services/gateway.put-plant: P with a lower limit of 30 for soil moisture → 200 with the plant
      - services/gateway -> services/plants.put-plant: P with a lower limit of 30 for soil moisture → 200 with the plant
      - services/plants -> platform.transaction: replace the plant P
      - public-api -> services/gateway.upload-batch: 00a1b2c3d4e5f607, reading 4711 → 200, 4711 is new
      - services/gateway -> services/ingest.upload-batch: 00a1b2c3d4e5f607, reading 4711 → 200, 4711 is new
      - services/ingest -> platform.publish: ingest.readings.v1, the event 00a1b2c3d4e5f607-4711 → acknowledged
      - services/ingest -> platform.publish: ingest.accepted-ranges.v1, the ranges of 00a1b2c3d4e5f607 with 4711 → acknowledged
      - services/ingest -> services/plants.reading-accepted: 00a1b2c3d4e5f607-4711
      - services/plants -> platform.transaction: add reading 4711 to the history of P
      - services/plants -> platform.commit: the position behind the event
      - services/alerts.handle-a-reading
      - public-api -> services/gateway.list-plants: 200 with P and reading 4711 as its latest
      - services/gateway -> services/plants.list-plants: 200 with P and reading 4711 as its latest
      - public-api -> services/gateway.list-alerts: 200 with the open alert
      - services/alerts.list-the-open-alerts
      - public-api -> services/gateway.get-history: P → 200 with reading 4711
      - services/gateway -> services/plants.get-history: P → 200 with reading 4711
    expect: the upload is answered with `new` before history and evaluation have seen the reading; within 10 seconds the reading is in the history of its plant; within 1 minute the alert is open, judged by the limit the client has just set, and its notification is handed to the push service; the two branches run independently and in any order
  the-server-side-starts-again:
    summary: The container host starts the server side again, and every service takes up its work where it stopped
    source: deployment of cloud
    given:
      - the server side stopped after `plants` had stored reading 4711 and before it confirmed the event
    hops:
      - platform -> container-host.volume: the backup volume, on another storage device than the database volume
      - platform -> container-host.run: the bus and the database, each with its volumes
      - services/ingest -> platform.read-from-beginning: ingest.accepted-ranges.v1 → the ranges of every sensor stick
      - services/alerts -> platform.connect: the role alerts → a connection to the schema of alerts
      - services/alerts -> platform.subscribe: ingest.readings.v1, alerts → the stream, from the position behind the last confirmed event
      - services/plants -> platform.connect: the role plants → a connection to the schema of plants
      - services/plants -> platform.subscribe: ingest.readings.v1, plants → the stream, from the position behind the last confirmed event
      - platform -> services/plants.deliver: plants, the partition of 00a1b2c3d4e5f607, the event 00a1b2c3d4e5f607-4711
      - services/plants -> platform.transaction: add reading 4711 to the history of P, which holds it already
      - services/plants -> platform.commit: the position behind the event
      - services/gateway -> container-host.publish: gateway, 443 → one port
    expect: the volumes, and with them every accepted event and every stored plant, alert and reading, outlast the stop; `ingest` answers uploads once it has read its accepted ranges; the event that `plants` had not confirmed is delivered again, and the history holds reading 4711 once; the port of `gateway` is the only one reachable from outside
