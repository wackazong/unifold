unifold: "0.4"
name: plantwatch
responsibility: Tells people when their house plants need water, using a sensor in the pot, a phone app and cloud services
status: planned
not:
  - automatic watering; plantwatch tells people and does not act
  - sensor sticks that reach the server by themselves (decision 0001)
  - identifying plant species; the user sets the thresholds or picks a preset
capabilities:
  app-ui:
  test-report:
    summary: Result of the automated end-to-end tests, for developers and CI
    contract: docs/references/test-report.md
needs:
  soil-probe:
    summary: Capacitive soil moisture probe with an analogue output
    contract: docs/references/soil-probe.md
  ambient-sensor:
    summary: Light and temperature sensor on an I2C bus
    contract: docs/references/ambient-sensor.md
  push-service:
    summary: Registers phones for an owner and delivers a notification to them, for example APNs or FCM
    contract: docs/references/push-service.md
  container-host:
    summary: Runs containers, gives them a private network and persistent volumes
    contract: docs/references/container-host.md
wiring:
  app-ui: mobile.app-ui
  test-report: test-rig.test-report
  mobile.sensor-link:
    real: device.ble-link
    simulated: emulator.ble-link
  mobile.cloud-api: cloud.public-api
  mobile.push-service: push-service
  cloud.push-service: push-service
  test-rig.device-under-test:
    real: device.ble-link
    simulated: emulator.ble-link
  test-rig.scenario-control: emulator.scenario-control
  test-rig.cloud-api: cloud.public-api
  cloud.container-host: container-host
  device.ambient-sensor: ambient-sensor
  device.soil-probe: soil-probe
scenarios:
  upload-and-alert:
    summary: The phone uploads readings, the server opens an alert and the owner is notified once
    source: requirements of plantwatch, the public API, consistency
    given:
      - the owner is registered on the phone, so the plant data of the app is active
    hops:
      - mobile -> cloud.upload-leads-to-alert
      - mobile.an-alert-arrives
    expect: within 1 minute after the upload response the alert is open on the server and its notification is handed to the push service; the phone shows one notification, a tap opens "Monstera", and the plant is first in the list with "needs water"
  an-interrupted-fetch-loses-nothing:
    summary: The rig cuts a fetch from the simulated sensor stick, fetches again and finds every reading in the history once
    source: test catalogue of test-rig, LINK-04 and RELAY-01
    hops:
      - test-report -> test-rig.run: simulated, the groups link and relay → LINK-04 and RELAY-01 passed, exit status 0
      - test-rig -> emulator.put-scenario: a scenario with a reading every 900 s → 200 with the state object, elapsed_s 0, readings_taken 1, bonding open
      - test-rig -> emulator.open-session: the rig bonds while bonding is open
      - test-rig -> emulator.status: count 1, bonding-open set
      - emulator -> test-rig.disconnected: the rig has its bond and disconnects
      - test-rig -> emulator.put-time: elapsed_s 7200 → 200 with the state object, readings_taken 9
      - test-rig -> emulator.put-link: drop_fetch_after 1 → 200 with the state object
      - test-rig -> emulator.open-session: bonded, encryption with the kept bond
      - test-rig -> emulator.status: the time reference, count 9
      - test-rig -> emulator.fetch: everything from the oldest stored reading → 1 record and no fetch result
      - emulator -> test-rig.disconnected
      - test-rig -> emulator.open-session: bonded, encryption with the kept bond
      - test-rig -> emulator.status: the time reference, count 9
      - test-rig -> emulator.fetch: everything from the oldest stored reading → 9 records, then a fetch result with success
      - test-rig -> cloud.put-plant: a test plant with the simulated sensor stick → 200 with the plant
      - test-rig -> cloud.upload-batch: the 9 fetched readings → 200, every reading is new
      - test-rig -> emulator.confirm: up to the last reading of the fetch → 80 02 00 00 00 00 00 00 00
      - emulator -> test-rig.disconnected
      - test-rig -> cloud.get-history: the test plant, raw → 200 with the 9 readings
    expect: the cut fetch delivers one record and confirms nothing; the second fetch delivers every reading the simulated sensor stick took, with the same values and tick counts as the first attempt; within 10 seconds after the upload each of the 9 readings is in the history once; the report has LINK-04 and RELAY-01 passed and the exit status is 0
