", "key": "framing.frames"}, {"unit": ".", "key": "transport.frames"}], "part-file": "docs/references/frames.md"}], "x": {}, "unit": ".", "page": "docs/diagrams/scenario-close.md", "diagram": {"source": "---\nconfig:\n  sequence:\n    height: 108\n---\nsequenceDiagram\n  participant phost as host<br/>Open a session, send data, close\n  participant psession as session<br/>«stateful»<br/>Runs the host side of a session<br/>through its states and timeouts\n  participant pclock as clock<br/>The current time in milliseconds\n  participant ptransport as transport<br/>«adapter»<br/>Sends and receives frames over<br/>the serial line\n  participant ptransport__serial as transport/serial<br/>«adapter»<br/>Moves frames through the serial<br/>port with deadlines\n  participant pcodec as codec<br/>«logic»<br/>Encodes a payload into the bytes<br/>of a frame and decodes a frame<br/>from bytes\n  participant puart as uart<br/>The serial port of the host<br/>computer, as a byte stream\n  participant ptransport__framing as transport/framing<br/>«logic»<br/>Cuts the byte stream from the<br/>line into frames\n  phost->>psession: 1 · close\n  activate psession\n  psession->>pclock: 2 · now\n  activate pclock\n  pclock-->>psession: ↩ 2\n  deactivate pclock\n  psession->>ptransport: 3 · send\n  activate ptransport\n  ptransport__serial->>pcodec: 4 · encode\n  activate pcodec\n  pcodec-->>ptransport__serial: ↩ 4\n  deactivate pcodec\n  ptransport__serial->>puart: 5 · write\n  activate puart\n  deactivate puart\n  deactivate ptransport\n  psession->>ptransport: 6 · receive\n  activate ptransport\n  ptransport__serial->>puart: 7 · read\n  activate puart\n  puart-->>ptransport__serial: ↩ 7\n  deactivate puart\n  ptransport__serial->>ptransport__framing: 8 · feed\n  activate ptransport__framing\n  ptransport__framing->>pcodec: 9 · decode\n  activate pcodec\n  pcodec-->>ptransport__framing: ↩ 9\n  deactivate pcodec\n  ptransport__framing-->>ptransport__serial: ↩ 8\n  deactivate ptransport__framing\n  ptransport-->>psession: ↩ 6\n  deactivate ptransport\n  deactivate psession\n  Note over phost,ptransport__framing: wrap: Expect: one frame `1F 01 02 1B` on the line#59; after the device's `1F 01 82 92`, close returns ok and the state is closed", "lifelines": {"phost": {"name": "host", "unit": ".", "side": "capability", "entry": "host"}, "psession": {"name": "session", "unit": "session"}, "pclock": {"name": "clock", "unit": ".", "side": "need", "entry": "clock"}, "ptransport": {"name": "transport", "unit": "transport"}, "ptransport__serial": {"name": "transport/serial", "unit": "transport/serial"}, "pcodec": {"name": "codec", "unit": "codec"}, "puart": {"name": "uart", "unit": ".", "side": "need", "entry": "uart"}, "ptransport__framing": {"name": "transport/framing", "unit": "transport/framing"}}}}, {"name": "garbage-before-frame", "summary": "Bytes that are not part of a frame arrive before the ACK", "source": "proto §4.3", "expect": "the bytes `00 FF 1E` before the frame `1F 01 81 9B` are dropped and receive returns the payload `81`", "hops": [{"caller": "session", "target": "transport", "part": "receive", "part-kind": "query", "contract": "docs/references/transport.md", "caller-unit": "session", "target-unit": "transport", "via": [{"unit": ".", "key": "session.transport"}], "part-file": "docs/references/transport.md"}, {"caller": "transport/serial", "target": "uart", "part": "read", "part-kind": "query", "contract": "docs/references/uart.md", "caller-unit": "transport/serial", "target-unit": null, "via": [{"unit": "transport", "key": "serial.uart"}, {"unit": ".", "key": "transport.uart"}], "part-file": "docs/references/uart.md"}, {"caller": "transport/serial", "target": "transport/framing", "part": "feed", "part-kind": "query", "contract": "transport/docs/references/framing.md", "caller-unit": "transport/serial", "target-unit": "transport/framing", "via": [{"unit": "transport", "key": "serial.framing"}], "part-file": "transport/docs/references/framing.md"}, {"caller": "transport/framing", "target": "codec", "part": "decode", "part-kind": "query", "contract": "docs/references/frames.md", "caller-unit": "transport/framing", "target-unit": "codec", "via": [{"unit": "transport", "key": "framing.frames"}, {"unit": ".", "key": "transport.frames"}], "part-file": "docs/references/frames.md"}], "x": {}, "unit": ".", "page": "docs/diagrams/scenario-garbage-before-frame.md", "diagram": {"source": "---\nconfig:\n  sequence:\n    height: 108\n---\nsequenceDiagram\n  participant psession as session<br/>«stateful»<br/>Runs the host side of a session<br/>through its states and timeouts\n  participant ptransport as transport<br/>«adapter»<br/>Sends and receives frames over<br/>the serial line\n  participant ptransport__serial as transport/serial<br/>«adapter»<br/>Moves frames through the serial<br/>port with deadlines\n  participant puart as uart<br/>The serial port of the host<br/>computer, as a byte stream\n  participant ptransport__framing as transport/framing<br/>«logic»<br/>Cuts the byte stream from the<br/>line into frames\n  participant pcodec as codec<br/>«logic»<br/>Encodes a payload into the bytes<br/>of a frame and decodes a frame<br/>from bytes\n  psession->>ptransport: 1 · receive\n  activate ptransport\n  ptransport__serial->>puart: 2 · read\n  activate puart\n  puart-->>ptransport__serial: ↩ 2\n  deactivate puart\n  ptransport__serial->>ptransport__framing: 3 · feed\n  activate ptransport__framing\n  ptransport__framing->>pcodec: 4 · decode\n  activate pcodec\n  pcodec-->>ptransport__framing: ↩ 4\n  deactivate pcodec\n  ptransport__framing-->>ptransport__serial: ↩ 3\n  deactivate ptransport__framing\n  ptransport-->>psession: ↩ 1\n  deactivate ptransport\n  Note over psession,pcodec: wrap: Expect: the bytes `00 FF 1E` before the frame `1F 01 81 9B` are dropped and receive returns the payload `81`", "lifelines": {"psession": {"name": "session", "unit": "session"}, "ptransport": {"name": "transport", "unit": "transport"}, "ptransport__serial": {"name": "transport/serial", "unit": "transport/serial"}, "puart": {"name": "uart", "unit": ".", "side": "need", "entry": "uart"}, "ptransport__framing": {"name": "transport/framing", "unit": "transport/framing"}, "pcodec": {"name": "codec", "unit": "codec"}}}}, {"name": "reassemble", "summary": "Two frames arrive in one read", "source": "proto §4.3", "expect": "receive returns the first payload; the second frame waits in the buffer for the next call", "hops": [{"caller": "transport", "target": "serial", "part": "receive", "part-kind": "query", "contract": "docs/references/transport.md", "caller-unit": null, "target-unit": "transport/serial", "via": [{"unit": "transport", "key": "transport"}], "part-file": "docs/references/transport.md"}, {"caller": "serial", "target": "framing", "part": "feed", "part-kind": "query", "contract": "transport/docs/references/framing.md", "caller-unit": "transport/serial", "target-unit": "transport/framing", "via": [{"unit": "transport", "key": "serial.framing"}], "part-file": "transport/docs/references/framing.md"}], "x": {}, "unit": "transport", "page": "transport/docs/diagrams/scenario-reassemble.md", "diagram": {"source": "---\nconfig:\n  sequence:\n    height: 92\n---\nsequenceDiagram\n  participant ptransport as transport<br/>Send one payload as a frame#59;<br/>receive the next frame's payload\n  participant pserial as serial<br/>«adapter»<br/>Moves frames through the serial<br/>port with deadlines\n  participant pframing as framing<br/>«logic»<br/>Cuts the byte stream from the<br/>line into frames\n  ptransport->>pserial: 1 · receive\n  activate pserial\n  pserial->>pframing: 2 · feed\n  activate pframing\n  pframing-->>pserial: ↩ 2\n  deactivate pframing\n  pserial-->>ptransport: ↩ 1\n  deactivate pserial\n  Note over ptransport,pframing: wrap: Expect: receive returns the first payload#59; the second frame waits in the buffer for the next call", "lifelines": {"ptransport": {"name": "transport", "unit": "transport", "side": "capability", "entry": "transport"}, "pserial": {"name": "serial", "unit": "transport/serial"}, "pframing": {"name": "framing", "unit": "transport/framing"}}}}], "docs": {"README.md": {"unit": ".", "kind": "readme", "title": "serial-line", "html": "<p>A program that opens a session to a device over a serial line, sends it data and closes the session, following the Serial Session Protocol. It is the small design example of unifold: three units, one of them a composite, every well-known kind once, six contracts with parts and fakes, scenarios across levels, and decisions of status derived and proposed. It is also the example of the build method <a href=\"https://github.com/wackazong/maike\">maike<\/a>, which writes files like these from a source document. The original lives in <a href=\"https://github.com/wackazong/maike/tree/main/examples/serial-line\">maike's examples/serial-line<\/a>; this copy differs from it only in this README, in the missing <code>maike/<\/code> folder with the sources, plan and review of the build and the <code>ignore<\/code> entry for it in <code>unifold.yaml<\/code>, and in the generated explorer page <code>unifold.html<\/code>.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>The protocol has three pieces of knowledge that change for different reasons: the layout of a frame, the state of a session and the way bytes move over the line. Each is one unit, so a change to one changes one unit. The line is a composite, because reassembling frames from a byte stream is a calculation that is tested alone, while the port itself is the one place that talks to the outside world. Time comes from outside as a platform need, so every timeout is tested with a clock the test moves.<\/p>\n<h2 id=\"md-commands\">Commands<\/h2>\n<pre><code class=\"language-sh\">alias unifold='python3 ../../docs/skills/unifold/scripts/unifold.py'\nunifold check --strict\nunifold show transport/serial\nunifold model --json | head<\/code><\/pre>\n<h2 id=\"md-read-next\">Read next<\/h2>\n<ol><li><a href=\"#.@doc:docs/references/frames.md\">frames<\/a>: one contract with parts, examples and a fake that is the real implementation.<\/li><li>The generated <a href=\"#.@scenario:open\">scenario open<\/a>: a story drawn end to end across two levels.<\/li><li><a href=\"#transport\">transport<\/a>: the composite adapter, and the decision that cut it.<\/li><\/ol>", "intro": "A program that opens a session to a device over a serial line, sends it data and closes the session, following the Serial Session Protocol. It is the small design example of unifold: three units, one of them a composite, every well-known kind once, six contracts with parts and fakes, scenarios across levels, and decisions of status derived and proposed. It is also the example of the build method <a href=\"https://github.com/wackazong/maike\">maike<\/a>, which writes files like these from a source document. The original lives in <a href=\"https://github.com/wackazong/maike/tree/main/examples/serial-line\">maike's examples/serial-line<\/a>; this copy differs from it only in this README, in the missing <code>maike/<\/code> folder with the sources, plan and review of the build and the <code>ignore<\/code> entry for it in <code>unifold.yaml<\/code>, and in the generated explorer page <code>unifold.html<\/code>.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>The protocol has three pieces of knowledge that change for different reasons: the layout of a frame, the state of a session and the way bytes move over the line. Each is one unit, so a change to one changes one unit. The line is a composite, because reassembling frames from a byte stream is a calculation that is tested alone, while the port itself is the one place that talks to the outside world. Time comes from outside as a platform need, so every timeout is tested with a clock the test moves.<\/p>"}, "docs/decisions/0001-what-the-host-does-with-a-frame-whose-crc-is-wrong.md": {"unit": ".", "kind": "decisions", "title": "What the host does with a frame whose CRC is wrong", "html": "<h2 id=\"md-context-and-problem-statement\">Context and Problem Statement<\/h2>\n<p>Proto §4.3 says that a frame whose CRC does not match is invalid and that what a receiver does with it &quot;is a matter of the implementation&quot;; it says what the device does, not what the host does. The host may get such a frame while it waits for an ACK. The choice changes the contract <code>transport.receive<\/code> and the behaviour of <code>open<\/code> and <code>close<\/code>, so it is a question for the owner of the project.<\/p>\n<h2 id=\"md-options\">Options<\/h2>\n<ul><li>Drop the frame and keep waiting until the deadline, as the device does.<\/li><li>Report <code>line-error<\/code> and close the session: a corrupted line is not to be trusted.<\/li><\/ul>\n<h2 id=\"md-recommendation\">Recommendation<\/h2>\n<p>Drop the frame and keep waiting: it matches the device, a single corrupted byte then costs one retry by the caller instead of a session, and the contracts already describe it this way.<\/p>\n<h2 id=\"md-answer\">Answer<\/h2>", "status": "proposed", "facts": [["status", "<span class=\"badge proposed\">proposed<\/span>"], ["date", "2026-10-27"]]}, "docs/decisions/0002-calls-are-synchronous-and-one-session-per-host-instance.md": {"unit": ".", "kind": "decisions", "title": "Calls are synchronous, and one host instance runs one session", "html": "<h2 id=\"md-context-and-problem-statement\">Context and Problem Statement<\/h2>\n<p>The sources say nothing about threads, callbacks or several sessions at once. The code needs a rule before the first contract is written.<\/p>\n<h2 id=\"md-considered-options\">Considered Options<\/h2>\n<ul><li>Synchronous calls that block until the protocol step is done; one session per host instance<\/li><li>Asynchronous calls with callbacks<\/li><li>Several sessions multiplexed over one line<\/li><\/ul>\n<h2 id=\"md-decision-outcome\">Decision Outcome<\/h2>\n<p>Chosen option: &quot;synchronous, one session&quot;, because the protocol itself is a strict request and answer on one line, and nothing in the sources asks for more.<\/p>\n<h3 id=\"md-consequences\">Consequences<\/h3>\n<ul><li>Good: every contract is a plain function; tests need no scheduler.<\/li><li>Bad: a caller that wants two lines creates two host instances.<\/li><\/ul>", "status": "proposed", "facts": [["status", "<span class=\"badge proposed\">proposed<\/span>"], ["date", "2026-10-27"]]}, "docs/decisions/0003-the-host-never-retries-an-open-on-its-own.md": {"unit": ".", "kind": "decisions", "title": "The host never retries an open on its own", "html": "<h2 id=\"md-source-says\">Source says<\/h2>\n<p>Proto §5.1: when no ACK arrives within 500 ms of sending OPEN, the open has failed and the host reports this to its caller. &quot;The host does not send OPEN again on its own.&quot;<\/p>\n<h2 id=\"md-context-and-problem-statement\">Context and Problem Statement<\/h2>\n<p>A failed open could be retried inside the host, which would hide line glitches from the caller.<\/p>\n<h2 id=\"md-decision-outcome\">Decision Outcome<\/h2>\n<p>Chosen option: &quot;report, never retry&quot;, because the source settles it. <code>open<\/code> returns <code>timeout<\/code> and the caller decides.<\/p>\n<h3 id=\"md-consequences\">Consequences<\/h3>\n<ul><li>Good: a test of <code>open<\/code> needs no retry logic, and the state after a failure is always closed.<\/li><li>Bad: a caller that wants retries writes them.<\/li><\/ul>", "status": "derived", "facts": [["status", "<span class=\"badge derived\">derived<\/span>"], ["date", "2026-10-27"], ["derived from", "proto §5.1"]]}, "docs/decisions/index.md": {"unit": ".", "kind": "decisions", "title": "Decisions of serial-line", "html": "<p><a href=\"#.\">README.md<\/a> · <a href=\"#.@doc:AGENTS.md\">AGENTS.md<\/a><\/p>\n<p>Accepted and derived decisions bind.<\/p>\n<div class=\"table\"><table><thead><tr><th>No.<\/th><th>Decision<\/th><th>Status<\/th><th>Date<\/th><\/tr><\/thead><tbody><tr><td>0001<\/td><td><a href=\"#.@doc:docs/decisions/0001-what-the-host-does-with-a-frame-whose-crc-is-wrong.md\">What the host does with a frame whose CRC is wrong<\/a><\/td><td><strong>proposed: not accepted, does not bind<\/strong><\/td><td>2026-10-27<\/td><\/tr><tr><td>0002<\/td><td><a href=\"#.@doc:docs/decisions/0002-calls-are-synchronous-and-one-session-per-host-instance.md\">Calls are synchronous, and one host instance runs one session<\/a><\/td><td><strong>proposed: not accepted, does not bind<\/strong><\/td><td>2026-10-27<\/td><\/tr><tr><td>0003<\/td><td><a href=\"#.@doc:docs/decisions/0003-the-host-never-retries-an-open-on-its-own.md\">The host never retries an open on its own<\/a><\/td><td><strong>derived: a source settles it; binds until a person accepts it<\/strong><\/td><td>2026-10-27<\/td><\/tr><\/tbody><\/table><\/div>"}, "docs/references/clock.md": {"unit": ".", "kind": "references", "title": "clock", "html": "<p>Contract of the need <code>clock<\/code> of <code>serial-line<\/code>: the current time, a service of the host platform. Notation: wit.\nSources: none; the protocol says only how long a wait may take<\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-now\">now<\/h3>\n<p class=field><strong>Kind:<\/strong> query<\/p>\n<pre><code class=\"language-wit\">now: func() -&gt; u64;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> none.<\/p>\n<p class=field><strong>Result:<\/strong> milliseconds since an arbitrary start. Two calls never return a smaller value after a larger one.<\/p>\n<p class=field><strong>Errors:<\/strong> none.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>monotonic<\/td><td><code>now()<\/code> twice<\/td><td>the second value is not smaller than the first<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>A clock that stands still until a test moves it: <code>advance(ms)<\/code> adds to what <code>now<\/code> returns. Faults it can inject: none.<\/p>"}, "docs/references/constants.md": {"unit": ".", "kind": "references", "title": "Constants", "html": "<p>Every fixed value the code needs, under the name the code uses. Everywhere else a value is named, never written out.<\/p>\n<div class=\"table\"><table><thead><tr><th>Name<\/th><th>Value<\/th><th>Unit<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td><code>MAGIC_BYTE<\/code><\/td><td><code>0x1F<\/code><\/td><td><\/td><td>proto §4.1 Table 3<\/td><\/tr><tr><td><code>MAX_PAYLOAD<\/code><\/td><td>255<\/td><td>bytes<\/td><td>proto §4.1 Table 3<\/td><\/tr><tr><td><code>MAX_DATA<\/code><\/td><td>254<\/td><td>bytes<\/td><td>proto §5.3<\/td><\/tr><tr><td><code>CRC_POLY<\/code><\/td><td><code>0x07<\/code><\/td><td><\/td><td>proto §4.1<\/td><\/tr><tr><td><code>CRC_INIT<\/code><\/td><td><code>0x00<\/code><\/td><td><\/td><td>proto §4.1<\/td><\/tr><tr><td><code>OPEN_TIMEOUT_MS<\/code><\/td><td>500<\/td><td>ms<\/td><td>proto §5.1<\/td><\/tr><tr><td><code>CLOSE_TIMEOUT_MS<\/code><\/td><td>500<\/td><td>ms<\/td><td>proto §5.2<\/td><\/tr><tr><td><code>OP_OPEN<\/code><\/td><td><code>0x01<\/code><\/td><td><\/td><td>proto §5.1<\/td><\/tr><tr><td><code>OP_CLOSE<\/code><\/td><td><code>0x02<\/code><\/td><td><\/td><td>proto §5.2<\/td><\/tr><tr><td><code>OP_DATA<\/code><\/td><td><code>0x03<\/code><\/td><td><\/td><td>proto §5.3<\/td><\/tr><tr><td><code>ACK_BIT<\/code><\/td><td><code>0x80<\/code><\/td><td><\/td><td>proto §2<\/td><\/tr><tr><td><code>READ_POLL_MS<\/code><\/td><td>50<\/td><td>ms<\/td><td>transport/0002<\/td><\/tr><tr><td><code>MAX_BUFFER_BYTES<\/code><\/td><td>1024<\/td><td>bytes<\/td><td>transport/framing/0001<\/td><\/tr><\/tbody><\/table><\/div>", "facts": [["name pattern", "\\b[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+\\b"]]}, "docs/references/conventions.md": {"unit": ".", "kind": "references", "title": "Conventions", "html": "<p>The stack, the folder idiom and how a unit receives what it needs. The two tables are read by <code>maike.py<\/code>.<\/p>\n<h2 id=\"md-stack\">Stack<\/h2>\n<p>Python 3.12, pytest 8 as the test runner, <code>uv<\/code> for dependencies and the virtual environment, ruff for lint and format, mypy for types. The real serial port is reached through pyserial; no other library.<\/p>\n<h2 id=\"md-units\">Units<\/h2>\n<div class=\"table\"><table><thead><tr><th>Unit<\/th><th>Interface<\/th><th>Implementation<\/th><th>Tests<\/th><\/tr><\/thead><tbody><tr><td><code>session<\/code><\/td><td><code>src/serial_line/session/api.py<\/code><\/td><td><code>src/serial_line/session/impl.py<\/code><\/td><td><code>tests/session/<\/code><\/td><\/tr><tr><td><code>codec<\/code><\/td><td><code>src/serial_line/codec/api.py<\/code><\/td><td><code>src/serial_line/codec/impl.py<\/code><\/td><td><code>tests/codec/<\/code><\/td><\/tr><tr><td><code>transport/framing<\/code><\/td><td><code>src/serial_line/transport/framing/api.py<\/code><\/td><td><code>src/serial_line/transport/framing/impl.py<\/code><\/td><td><code>tests/transport/framing/<\/code><\/td><\/tr><tr><td><code>transport/serial<\/code><\/td><td><code>src/serial_line/transport/serial/api.py<\/code><\/td><td><code>src/serial_line/transport/serial/impl.py<\/code><\/td><td><code>tests/transport/serial/<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-commands\">Commands<\/h2>\n<div class=\"table\"><table><thead><tr><th>Command<\/th><th>Line<\/th><\/tr><\/thead><tbody><tr><td><code>install<\/code><\/td><td><code>uv sync<\/code><\/td><\/tr><tr><td><code>check<\/code><\/td><td><code>uv run pytest -q &amp;&amp; uv run ruff check . &amp;&amp; uv run ruff format --check . &amp;&amp; uv run mypy src<\/code><\/td><\/tr><tr><td><code>test-one<\/code><\/td><td><code>uv run pytest -q FILE<\/code><\/td><\/tr><tr><td><code>worktree<\/code><\/td><td><code>uv sync<\/code><\/td><\/tr><tr><td><code>run<\/code><\/td><td><code>uv run serial-line --port /dev/ttyUSB0<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-idiom\">Idiom<\/h2>\n<ul><li>Every part of a contract is a function or a dataclass in the interface module; <code>result&lt;T, E&gt;<\/code> becomes a return value or a raised exception class named after the variant case, as <code>SessionError.Timeout<\/code>.<\/li><li>A unit receives what it needs as constructor arguments typed with the interface protocol of the need, so a test passes a fake.<\/li><li>A value a unit keeps opaque, such as the framing buffer, is a dataclass of that unit's interface module.<\/li><\/ul>"}, "docs/references/frames.md": {"unit": ".", "kind": "references", "title": "frames", "html": "<p>Contract of <code>codec.frames<\/code>, the layout of a frame. Notation: wit.\nSources: proto §4<\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-encode\">encode<\/h3>\n<p class=field><strong>Kind:<\/strong> query<\/p>\n<pre><code class=\"language-wit\">encode: func(payload: list&lt;u8&gt;) -&gt; result&lt;list&lt;u8&gt;, encode-error&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> <code>len(payload) &lt;= MAX_PAYLOAD<\/code>.<\/p>\n<p class=field><strong>Result:<\/strong> the bytes of one frame: <code>MAGIC_BYTE<\/code>, the length, the payload, then the CRC-8 over length and payload with <code>CRC_POLY<\/code> and <code>CRC_INIT<\/code>.<\/p>\n<p class=field><strong>Errors:<\/strong> <code>too-long<\/code> when the payload exceeds <code>MAX_PAYLOAD<\/code>.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>empty payload, proto §4.2<\/td><td><code>encode([])<\/code><\/td><td><code>1F 00 00<\/code><\/td><\/tr><tr><td>OPEN, proto §4.2<\/td><td><code>encode([01])<\/code><\/td><td><code>1F 01 01 12<\/code><\/td><\/tr><tr><td>DATA hi, proto §4.2<\/td><td><code>encode([03, 68, 69])<\/code><\/td><td><code>1F 03 03 68 69 C2<\/code><\/td><\/tr><tr><td>longest payload<\/td><td>255 bytes <code>00<\/code><\/td><td>258 bytes, the last <code>D7<\/code><\/td><\/tr><tr><td>one over the limit<\/td><td>256 bytes<\/td><td><code>too-long<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-decode\">decode<\/h3>\n<p class=field><strong>Kind:<\/strong> query<\/p>\n<pre><code class=\"language-wit\">decode: func(bytes: list&lt;u8&gt;) -&gt; result&lt;decoded, decode-error&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> none.<\/p>\n<p class=field><strong>Result:<\/strong> the frame at the start of <code>bytes<\/code> and how many bytes it used. Bytes after the frame are not read.<\/p>\n<p class=field><strong>Errors:<\/strong> <code>bad-magic<\/code> when the first byte is not <code>MAGIC_BYTE<\/code>; <code>incomplete<\/code> when the bytes end before the frame does; <code>bad-crc<\/code> when the CRC does not match.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>ACK, proto §4.2<\/td><td><code>decode([1F, 01, 81, 9B])<\/code><\/td><td>payload <code>[81]<\/code>, used 4<\/td><\/tr><tr><td>trailing bytes<\/td><td><code>decode([1F, 00, 00, 1F])<\/code><\/td><td>payload <code>[]<\/code>, used 3<\/td><\/tr><tr><td>garbage, proto §4.3<\/td><td><code>decode([00, 1F, 01, 81, 9B])<\/code><\/td><td><code>bad-magic<\/code><\/td><\/tr><tr><td>cut short<\/td><td><code>decode([1F, 01, 81])<\/code><\/td><td><code>incomplete<\/code><\/td><\/tr><tr><td>wrong CRC<\/td><td><code>decode([1F, 01, 81, 00])<\/code><\/td><td><code>bad-crc<\/code><\/td><\/tr><tr><td>magic byte inside the payload, proto §4.3<\/td><td><code>decode([1F, 01, 1F, D5])<\/code><\/td><td><code>bad-crc<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-decoded\">decoded<\/h3>\n<p class=field><strong>Kind:<\/strong> type<\/p>\n<pre><code class=\"language-wit\">record decoded { payload: list&lt;u8&gt;, used: u16 }<\/code><\/pre>\n<div class=\"table\"><table><thead><tr><th>Field<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>payload<\/td><td>the payload of the frame, without magic, length and CRC<\/td><\/tr><tr><td>used<\/td><td>how many bytes of the input the frame took<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-encode-error\">encode-error<\/h3>\n<p class=field><strong>Kind:<\/strong> type<\/p>\n<pre><code class=\"language-wit\">variant encode-error { too-long }<\/code><\/pre>\n<h3 id=\"md-decode-error\">decode-error<\/h3>\n<p class=field><strong>Kind:<\/strong> type<\/p>\n<pre><code class=\"language-wit\">variant decode-error { bad-magic, incomplete, bad-crc }<\/code><\/pre>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>The real implementation: the codec is small, deterministic and has no side effects, and its users produce inputs that no examples table can list.<\/p>"}, "docs/references/glossary.md": {"unit": ".", "kind": "references", "title": "Glossary", "html": "<p>The terms of the protocol as the code uses them. One row per term, so that a unit can cite one.<\/p>\n<div class=\"table\"><table><thead><tr><th>Term<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>host<\/td><td>The side that opens the session: this program.<\/td><\/tr><tr><td>device<\/td><td>The side that answers over the line. It never opens a session.<\/td><\/tr><tr><td>session<\/td><td>The state between a successful open and a close. Data travels only inside a session.<\/td><\/tr><tr><td>frame<\/td><td>The unit of transmission on the line: magic byte, length, payload, CRC.<\/td><\/tr><tr><td>payload<\/td><td>The bytes a frame carries. The first byte is the operation code.<\/td><\/tr><tr><td>ACK<\/td><td>A frame whose payload is the operation code of the request with the top bit set.<\/td><\/tr><tr><td>magic byte<\/td><td>The byte <code>MAGIC_BYTE<\/code> that starts every frame.<\/td><\/tr><\/tbody><\/table><\/div>"}, "docs/references/host.md": {"unit": ".", "kind": "references", "title": "host", "html": "<p>Contract of <code>serial-line.host<\/code>, the calls a program makes to run a session. Notation: wit.\nSources: proto §5<\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-open\">open<\/h3>\n<p class=field><strong>Kind:<\/strong> command<\/p>\n<pre><code class=\"language-wit\">open: func() -&gt; result&lt;_, session-error&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> the state is closed.<\/p>\n<p class=field><strong>Result:<\/strong> <code>OP_OPEN<\/code> was sent as one frame, the ACK arrived within <code>OPEN_TIMEOUT_MS<\/code>, and the state is open.<\/p>\n<p class=field><strong>Errors:<\/strong> <code>already-open<\/code> when the state is not closed; <code>timeout<\/code> when no ACK arrived within <code>OPEN_TIMEOUT_MS<\/code>, the state is closed again; <code>line-error<\/code> when the line failed, the state is closed.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>device answers, proto §5.1<\/td><td><code>open()<\/code>, the line answers <code>1F 01 81 9B<\/code><\/td><td>ok, state open<\/td><\/tr><tr><td>device silent, proto §5.1<\/td><td><code>open()<\/code>, nothing arrives for <code>OPEN_TIMEOUT_MS<\/code><\/td><td><code>timeout<\/code>, state closed<\/td><\/tr><tr><td>opened twice, proto §5.4<\/td><td><code>open()<\/code> while open<\/td><td><code>already-open<\/code>, state unchanged<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-send\">send<\/h3>\n<p class=field><strong>Kind:<\/strong> command<\/p>\n<pre><code class=\"language-wit\">send: func(data: list&lt;u8&gt;) -&gt; result&lt;_, session-error&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> the state is open; <code>len(data) &lt;= MAX_DATA<\/code>.<\/p>\n<p class=field><strong>Result:<\/strong> one frame with the payload <code>OP_DATA<\/code> followed by <code>data<\/code> was sent. Nothing is awaited.<\/p>\n<p class=field><strong>Errors:<\/strong> <code>not-open<\/code> when the state is not open; <code>too-long<\/code> when <code>data<\/code> has more than <code>MAX_DATA<\/code> bytes; <code>line-error<\/code> when the write failed.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>two bytes, proto §4.2<\/td><td><code>send([68, 69])<\/code> while open<\/td><td>ok, the line carries <code>1F 03 03 68 69 C2<\/code><\/td><\/tr><tr><td>longest data<\/td><td>254 bytes<\/td><td>ok<\/td><\/tr><tr><td>one over the limit<\/td><td>255 bytes<\/td><td><code>too-long<\/code>, nothing sent<\/td><\/tr><tr><td>closed<\/td><td><code>send([68])<\/code> while closed<\/td><td><code>not-open<\/code>, nothing sent<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-close\">close<\/h3>\n<p class=field><strong>Kind:<\/strong> command<\/p>\n<pre><code class=\"language-wit\">close: func() -&gt; result&lt;_, session-error&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> the state is open.<\/p>\n<p class=field><strong>Result:<\/strong> <code>OP_CLOSE<\/code> was sent, and the state is closed, whether the ACK arrived or <code>CLOSE_TIMEOUT_MS<\/code> passed.<\/p>\n<p class=field><strong>Errors:<\/strong> <code>not-open<\/code> when the state is not open; <code>line-error<\/code> when the line failed, the state is closed.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>device answers, proto §5.2<\/td><td><code>close()<\/code>, the line answers <code>1F 01 82 92<\/code><\/td><td>ok, state closed<\/td><\/tr><tr><td>device silent, proto §5.2<\/td><td><code>close()<\/code>, nothing arrives for <code>CLOSE_TIMEOUT_MS<\/code><\/td><td>ok, state closed<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-session-error\">session-error<\/h3>\n<p class=field><strong>Kind:<\/strong> type<\/p>\n<pre><code class=\"language-wit\">variant session-error { already-open, not-open, too-long, timeout, line-error }<\/code><\/pre>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>already-open<\/td><td>open was called while the state is not closed<\/td><\/tr><tr><td>not-open<\/td><td>send or close was called while the state is not open<\/td><\/tr><tr><td>too-long<\/td><td>the data does not fit into one frame<\/td><\/tr><tr><td>timeout<\/td><td>the device did not answer within the time the protocol allows<\/td><\/tr><tr><td>line-error<\/td><td>the serial line failed; the session is closed<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>Replays the examples: answers the calls of the examples table with their results and fails any other call with <code>unexpected-call<\/code>. Faults it can inject: none. Shipped with the library for the tests of host programs; this project's own integration tests do not use it, the harness drives the real session through a test client on the line.<\/p>"}, "docs/references/test-kit.md": {"unit": ".", "kind": "references", "title": "Test kit", "html": "<p>How every test of this project builds fakes, wires units and waits. At most 25 lines; every step reads it.<\/p>\n<ul><li>A fake of a need is a class in <code>tests/fakes/&lt;contract&gt;.py<\/code>, one per contract, built as the contract's <code>## Fake<\/code> says. A test constructs it and passes it to the unit under test.<\/li><li><code>FakeUart<\/code>: <code>sent()<\/code> returns every byte written; <code>deliver(bytes, after_ms=0)<\/code> queues bytes; <code>fail_next_write()<\/code> and <code>fail_next_read()<\/code> arm one <code>failed<\/code>.<\/li><li><code>FakeClock<\/code>: <code>advance(ms)<\/code> moves <code>now()<\/code>; nothing else moves it. A <code>read<\/code> with a timeout on <code>FakeUart<\/code> advances the <code>FakeClock<\/code> it was given.<\/li><li><code>FakeTransport<\/code>: <code>sent()<\/code> returns the payloads given to <code>send<\/code>; <code>script(payload)<\/code> queues an answer for <code>receive<\/code>; <code>fail_next_send()<\/code>, <code>fail_next_receive()<\/code> arm <code>line-error<\/code>.<\/li><li>The real <code>codec<\/code> and the real <code>framing<\/code> stand in for their contracts, as the contracts say.<\/li><li><code>FakeHost<\/code> in <code>src/serial_line/testing.py<\/code> is the fake of the root capability <code>host<\/code>, shipped for the project's users to test their code against; this project's tests do not use it.<\/li><li>Unit tests live under <code>tests/&lt;unit path&gt;/<\/code>, one file per part, one test per Examples row named <code>test_&lt;part&gt;_&lt;case&gt;<\/code>.<\/li><li>Integration tests live in <code>tests/integration/<\/code>, one file per scenario group, one test per scenario named <code>test_&lt;scenario&gt;<\/code>.<\/li><li><code>harness.py<\/code> in <code>tests/integration/<\/code> starts the wired system with <code>FakeUart<\/code> and <code>FakeClock<\/code> at the root needs and stops it, leaving nothing running: <code>with wired_system() as (host, uart, clock)<\/code>.<\/li><li><code>DeviceClient<\/code> in the harness speaks the protocol from proto §4 and §5 on the fake line: <code>expect_frame(payload)<\/code>, <code>answer(payload)<\/code>.<\/li><li><code>wait_until(predicate, timeout_ms)<\/code> polls with the fake clock; <code>assert_silence(uart, ms)<\/code> waits longer than the longest internal wait.<\/li><\/ul>"}, "docs/references/transport.md": {"unit": ".", "kind": "references", "title": "transport", "html": "<p>Contract of <code>transport.transport<\/code>, moving one payload at a time over the line. Notation: wit.\nSources: proto §3, §4<\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-send\">send<\/h3>\n<p class=field><strong>Kind:<\/strong> command<\/p>\n<pre><code class=\"language-wit\">send: func(payload: list&lt;u8&gt;) -&gt; result&lt;_, transport-error&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> <code>len(payload) &lt;= MAX_PAYLOAD<\/code>.<\/p>\n<p class=field><strong>Result:<\/strong> the payload was written to the line as exactly one frame.<\/p>\n<p class=field><strong>Errors:<\/strong> <code>too-long<\/code> when the payload exceeds <code>MAX_PAYLOAD<\/code>; <code>line-error<\/code> when the write failed.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>OPEN, proto §4.2<\/td><td><code>send([01])<\/code><\/td><td>the line carries <code>1F 01 01 12<\/code><\/td><\/tr><tr><td>empty payload, proto §4.2<\/td><td><code>send([])<\/code><\/td><td>the line carries <code>1F 00 00<\/code><\/td><\/tr><tr><td>one over the limit<\/td><td>256 bytes<\/td><td><code>too-long<\/code>, nothing written<\/td><\/tr><tr><td>port fails<\/td><td><code>send([01])<\/code> while the port fails<\/td><td><code>line-error<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-receive\">receive<\/h3>\n<p class=field><strong>Kind:<\/strong> query<\/p>\n<pre><code class=\"language-wit\">receive: func(deadline-ms: u32) -&gt; result&lt;list&lt;u8&gt;, transport-error&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> none.<\/p>\n<p class=field><strong>Result:<\/strong> the payload of the next valid frame on the line, as soon as it is complete. Bytes before a magic byte are dropped. Bytes after the frame stay for the next call.<\/p>\n<p class=field><strong>Errors:<\/strong> <code>timeout<\/code> when no complete valid frame arrived within <code>deadline-ms<\/code>; <code>line-error<\/code> when the read failed.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>ACK arrives, proto §4.2<\/td><td>the line delivers <code>1F 01 81 9B<\/code><\/td><td><code>[81]<\/code><\/td><\/tr><tr><td>garbage first, proto §4.3<\/td><td>the line delivers <code>00 FF 1E 1F 01 81 9B<\/code><\/td><td><code>[81]<\/code><\/td><\/tr><tr><td>two frames in one read<\/td><td>the line delivers <code>1F 01 81 9B 1F 00 00<\/code><\/td><td><code>[81]<\/code>, then <code>[]<\/code> on the next call<\/td><\/tr><tr><td>silence<\/td><td>nothing arrives for <code>deadline-ms<\/code><\/td><td><code>timeout<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-transport-error\">transport-error<\/h3>\n<p class=field><strong>Kind:<\/strong> type<\/p>\n<pre><code class=\"language-wit\">variant transport-error { too-long, timeout, line-error }<\/code><\/pre>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>Replays the examples: <code>send<\/code> records the payload and answers ok, <code>receive<\/code> answers the next scripted payload or <code>timeout<\/code>. Any other call fails with <code>unexpected-call<\/code>. Faults it can inject: <code>line-error<\/code> on the next send, <code>line-error<\/code> on the next receive.<\/p>"}, "docs/references/uart.md": {"unit": ".", "kind": "references", "title": "uart", "html": "<p>Contract of the need <code>uart<\/code> of <code>serial-line<\/code>: the serial port of the host computer, opened at 115200 baud, 8 data bits, no parity, one stop bit. Notation: wit.\nSources: proto §3<\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-write\">write<\/h3>\n<p class=field><strong>Kind:<\/strong> command<\/p>\n<pre><code class=\"language-wit\">write: func(bytes: list&lt;u8&gt;) -&gt; result&lt;_, uart-error&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> the port is open.<\/p>\n<p class=field><strong>Result:<\/strong> every byte was handed to the port, in order.<\/p>\n<p class=field><strong>Errors:<\/strong> <code>failed<\/code> when the port reported an error; the bytes may be partly written.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>a frame<\/td><td><code>write([1F, 01, 01, 12])<\/code><\/td><td>ok, the port received the four bytes<\/td><\/tr><tr><td>port gone<\/td><td><code>write([1F])<\/code> after the port failed<\/td><td><code>failed<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-read\">read<\/h3>\n<p class=field><strong>Kind:<\/strong> query<\/p>\n<pre><code class=\"language-wit\">read: func(max: u16, timeout-ms: u32) -&gt; result&lt;list&lt;u8&gt;, uart-error&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> the port is open.<\/p>\n<p class=field><strong>Result:<\/strong> the bytes that arrived, at most <code>max<\/code>, as soon as at least one arrived or <code>timeout-ms<\/code> passed. An empty list means that nothing arrived in time.<\/p>\n<p class=field><strong>Errors:<\/strong> <code>failed<\/code> when the port reported an error.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>bytes waiting<\/td><td><code>read(64, 50)<\/code> with <code>1F 01 81 9B<\/code> waiting<\/td><td><code>[1F, 01, 81, 9B]<\/code><\/td><\/tr><tr><td>silence<\/td><td><code>read(64, 50)<\/code>, nothing arrives<\/td><td><code>[]<\/code> after 50 ms<\/td><\/tr><tr><td>port gone<\/td><td><code>read(64, 50)<\/code> after the port failed<\/td><td><code>failed<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-uart-error\">uart-error<\/h3>\n<p class=field><strong>Kind:<\/strong> type<\/p>\n<pre><code class=\"language-wit\">variant uart-error { failed }<\/code><\/pre>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>A port in memory: <code>write<\/code> records the bytes, <code>read<\/code> delivers bytes that the test has scripted, in the order and with the delays the test set, and answers empty when nothing is scripted for the time. Helpers: <code>sent()<\/code> returns every byte written so far; <code>deliver(bytes)<\/code> queues bytes for the next reads; <code>fail-next-write()<\/code> and <code>fail-next-read()<\/code> arm <code>failed<\/code> once.<\/p>"}, "AGENTS.md": {"unit": ".", "kind": "other", "title": "AGENTS.md: serial-line", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#.\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>\n<h2 id=\"md-documents\">Documents<\/h2>\n<div class=\"table\"><table><thead><tr><th>Kind<\/th><th>Files<\/th><\/tr><\/thead><tbody><tr><td>Look up<\/td><td><a href=\"#.@doc:docs/references/clock.md\">clock<\/a>, <a href=\"#.@doc:docs/references/constants.md\">constants<\/a>, <a href=\"#.@doc:docs/references/conventions.md\">conventions<\/a>, <a href=\"#.@doc:docs/references/frames.md\">frames<\/a>, <a href=\"#.@doc:docs/references/glossary.md\">glossary<\/a>, <a href=\"#.@doc:docs/references/host.md\">host<\/a>, <a href=\"#.@doc:docs/references/test-kit.md\">test-kit<\/a>, <a href=\"#.@doc:docs/references/transport.md\">transport<\/a>, <a href=\"#.@doc:docs/references/uart.md\">uart<\/a><\/td><\/tr><tr><td>Understand<\/td><td><a href=\"#.@doc:docs/decisions/index.md\">decisions<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-unifold\">unifold<\/h2>\n<p>This repository has a <a href=\"https://unifold.md\">unifold<\/a> map. A folder with a <code>unifold.yaml<\/code> is a unit: the file says what the unit provides and needs, and the unit above connects needs to providers. Read the map before you change an interface; keep it true after.<\/p>\n<ul><li><code>unifold show PATH<\/code>: a unit, its capabilities and needs, and who is on the other side<\/li><li><code>unifold capability PATH NAME<\/code>: both ends of one connection, with contracts<\/li><li><code>unifold check<\/code>: is the map consistent (<code>--fix<\/code> rewrites generated files)<\/li><\/ul>\n<div class=\"table\"><table><thead><tr><th>Unit<\/th><th>Path<\/th><th>Responsibility<\/th><\/tr><\/thead><tbody><tr><td>codec<\/td><td><code>codec<\/code><\/td><td>Encodes a payload into the bytes of a frame and decodes a frame from bytes (planned)<\/td><\/tr><tr><td>session<\/td><td><code>session<\/code><\/td><td>Runs the host side of a session through its states and timeouts (planned)<\/td><\/tr><tr><td>transport<\/td><td><code>transport<\/code><\/td><td>Sends and receives frames over the serial line (planned)<\/td><\/tr><tr><td>framing<\/td><td><code>transport/framing<\/code><\/td><td>Cuts the byte stream from the line into frames (planned)<\/td><\/tr><tr><td>serial<\/td><td><code>transport/serial<\/code><\/td><td>Moves frames through the serial port with deadlines (planned)<\/td><\/tr><\/tbody><\/table><\/div>"}, "codec/README.md": {"unit": "codec", "kind": "readme", "title": "codec", "html": "<p>Turns a payload into the bytes of one frame and the bytes of one frame back into a payload. A pure calculation: no port, no buffer, no time.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>The frame layout is the one thing both directions of the line must agree on, so it is written once and tested against the vectors of the protocol. Because the unit is pure, its users take the real thing in their tests instead of a fake, which could only disagree with it. It does not know where a frame starts in a stream of bytes; that is a policy of the line, not of the layout.<\/p>", "intro": "Turns a payload into the bytes of one frame and the bytes of one frame back into a payload. A pure calculation: no port, no buffer, no time.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>The frame layout is the one thing both directions of the line must agree on, so it is written once and tested against the vectors of the protocol. Because the unit is pure, its users take the real thing in their tests instead of a fake, which could only disagree with it. It does not know where a frame starts in a stream of bytes; that is a policy of the line, not of the layout.<\/p>"}, "codec/docs/decisions/0001-a-frame-is-magic-length-payload-and-crc.md": {"unit": "codec", "kind": "decisions", "title": "A frame is magic, length, payload and CRC", "html": "<h2 id=\"md-source-says\">Source says<\/h2>\n<p>Proto §4.1, Table 3: a frame is one magic byte 0x1F, one length byte with the number of payload bytes from 0 to 255, the payload, and one CRC byte. The CRC is CRC-8 with the polynomial 0x07, initial value 0x00, no reflection and no final XOR, over the length byte followed by the payload. §4.2 gives six frames as examples.<\/p>\n<h2 id=\"md-context-and-problem-statement\">Context and Problem Statement<\/h2>\n<p>The layout is the secret of this unit; the source fixes every field.<\/p>\n<h2 id=\"md-decision-outcome\">Decision Outcome<\/h2>\n<p>Chosen option: &quot;Table 3 as written&quot;, because the source settles it. The examples of §4.2 are the first tests, word for word, in the contract <code>frames<\/code>.<\/p>\n<h3 id=\"md-consequences\">Consequences<\/h3>\n<ul><li>Good: no choice is left to the implementer.<\/li><li>Bad: none.<\/li><\/ul>", "status": "derived", "facts": [["status", "<span class=\"badge derived\">derived<\/span>"], ["date", "2026-10-27"], ["derived from", "proto §4.1, Table 3"]]}, "codec/docs/decisions/index.md": {"unit": "codec", "kind": "decisions", "title": "Decisions of codec", "html": "<p><a href=\"#codec\">README.md<\/a> · <a href=\"#codec@doc:AGENTS.md\">AGENTS.md<\/a><\/p>\n<p>Accepted and derived decisions bind.<\/p>\n<div class=\"table\"><table><thead><tr><th>No.<\/th><th>Decision<\/th><th>Status<\/th><th>Date<\/th><\/tr><\/thead><tbody><tr><td>0001<\/td><td><a href=\"#codec@doc:docs/decisions/0001-a-frame-is-magic-length-payload-and-crc.md\">A frame is magic, length, payload and CRC<\/a><\/td><td><strong>derived: a source settles it; binds until a person accepts it<\/strong><\/td><td>2026-10-27<\/td><\/tr><\/tbody><\/table><\/div>"}, "codec/AGENTS.md": {"unit": "codec", "kind": "other", "title": "AGENTS.md: codec", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#codec\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>\n<h2 id=\"md-documents\">Documents<\/h2>\n<div class=\"table\"><table><thead><tr><th>Kind<\/th><th>Files<\/th><\/tr><\/thead><tbody><tr><td>Understand<\/td><td><a href=\"#codec@doc:docs/decisions/index.md\">decisions<\/a><\/td><\/tr><\/tbody><\/table><\/div>"}, "session/README.md": {"unit": "session", "kind": "readme", "title": "session", "html": "<p>The host side of a session: it opens, sends data and closes, and it knows at every moment which of the four states of the protocol it is in. Programs call it; it is the only unit that talks to callers.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>The protocol's state table is the one thing a caller can get wrong, so it lives in one unit that refuses an open while open and a send while closed. Timeouts are measured with a clock the unit is given, never with sleeps, so a test of the 500 ms rule takes no time. The unit knows nothing about bytes: it sends payloads and gets payloads back, and whatever moves them is behind the need <code>transport<\/code>.<\/p>", "intro": "The host side of a session: it opens, sends data and closes, and it knows at every moment which of the four states of the protocol it is in. Programs call it; it is the only unit that talks to callers.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>The protocol's state table is the one thing a caller can get wrong, so it lives in one unit that refuses an open while open and a send while closed. Timeouts are measured with a clock the unit is given, never with sleeps, so a test of the 500 ms rule takes no time. The unit knows nothing about bytes: it sends payloads and gets payloads back, and whatever moves them is behind the need <code>transport<\/code>.<\/p>"}, "session/docs/decisions/0001-the-session-has-four-states.md": {"unit": "session", "kind": "decisions", "title": "The session has four states", "html": "<h2 id=\"md-source-says\">Source says<\/h2>\n<p>Proto §5.4, Table 5: the host side is closed, opening, open or closing. Closed is entered at start, after a close completes and after an open fails. Opening is entered when OPEN was sent and left when the ACK arrives or 500 ms pass. Open is entered when the ACK of OPEN arrived and left when the caller closes. Closing is entered when CLOSE was sent and left when the ACK arrives or 500 ms pass. A caller that opens while not closed, or sends while not open, has made an error; the host reports it and changes no state.<\/p>\n<h2 id=\"md-context-and-problem-statement\">Context and Problem Statement<\/h2>\n<p>The unit needs a state machine; the source gives one.<\/p>\n<h2 id=\"md-decision-outcome\">Decision Outcome<\/h2>\n<p>Chosen option: &quot;the four states of Table 5, as written&quot;, because the source settles it. The table in <code>docs/explanation/runtime.md<\/code> is a restatement for the code.<\/p>\n<h3 id=\"md-consequences\">Consequences<\/h3>\n<ul><li>Good: every transition has a test named after a row of the table.<\/li><li>Bad: none.<\/li><\/ul>", "status": "derived", "facts": [["status", "<span class=\"badge derived\">derived<\/span>"], ["date", "2026-10-27"], ["derived from", "proto §5.4, Table 5"]]}, "session/docs/decisions/index.md": {"unit": "session", "kind": "decisions", "title": "Decisions of session", "html": "<p><a href=\"#session\">README.md<\/a> · <a href=\"#session@doc:AGENTS.md\">AGENTS.md<\/a><\/p>\n<p>Accepted and derived decisions bind.<\/p>\n<div class=\"table\"><table><thead><tr><th>No.<\/th><th>Decision<\/th><th>Status<\/th><th>Date<\/th><\/tr><\/thead><tbody><tr><td>0001<\/td><td><a href=\"#session@doc:docs/decisions/0001-the-session-has-four-states.md\">The session has four states<\/a><\/td><td><strong>derived: a source settles it; binds until a person accepts it<\/strong><\/td><td>2026-10-27<\/td><\/tr><\/tbody><\/table><\/div>"}, "session/docs/explanation/context.md": {"unit": "session", "kind": "explanation", "title": "Context of session", "html": "<p>What this unit takes over from the units above. The only file of the unit that links upward.<\/p>\n<h2 id=\"md-from-serial-line\">From serial-line<\/h2>\n<h3 id=\"md-serial-line0002-calls-are-synchronous-and-one-host-instance-runs-one-session\"><a href=\"#.@doc:docs/decisions/0002-calls-are-synchronous-and-one-session-per-host-instance.md\">serial-line/0002 Calls are synchronous, and one host instance runs one session<\/a><\/h3>\n<p>Says: every call blocks until the protocol step is done; one host instance runs one session.<\/p>\n<p>Here: <code>open<\/code> and <code>close<\/code> return only when the ACK arrived or the timeout passed; the state lives in the instance.<\/p>\n<h3 id=\"md-serial-line0003-the-host-never-retries-an-open-on-its-own\"><a href=\"#.@doc:docs/decisions/0003-the-host-never-retries-an-open-on-its-own.md\">serial-line/0003 The host never retries an open on its own<\/a><\/h3>\n<p>Says: when no ACK arrives within 500 ms, open has failed and the host reports it; it does not send OPEN again.<\/p>\n<p>Here: <code>open<\/code> returns <code>timeout<\/code> after one attempt and the state is closed.<\/p>\n<h3 id=\"md-serial-line-open_timeout_ms\"><a href=\"#.@doc:docs/references/constants.md#open_timeout_ms\">serial-line: OPEN_TIMEOUT_MS<\/a><\/h3>\n<p>Says: 500 ms, from proto §5.1.<\/p>\n<p>Here: the deadline of the wait for the ACK of open.<\/p>"}, "session/docs/explanation/invariants.md": {"unit": "session", "kind": "explanation", "title": "Invariants of session", "html": "<p>What is true of the session at every moment.<\/p>\n<ul><li>The state is one of closed, opening, open, closing, and only a transition of <code>runtime.md<\/code> changes it.<\/li><li>No payload is sent in the state closed except <code>OP_OPEN<\/code>, and none in the state open except <code>OP_DATA<\/code> and <code>OP_CLOSE<\/code>.<\/li><li>The unit never sleeps; every wait is a <code>receive<\/code> with a deadline computed from the clock.<\/li><\/ul>"}, "session/docs/explanation/runtime.md": {"unit": "session", "kind": "explanation", "title": "Runtime of session", "html": "<p>The states of the host side and what moves it between them, as the code needs them. Source: proto §5.4, Table 5, through <a href=\"#session@doc:docs/decisions/0001-the-session-has-four-states.md\">decision 0001<\/a>.<\/p>\n<h2 id=\"md-states\">States<\/h2>\n<div class=\"table\"><table><thead><tr><th>State<\/th><th>Enters when<\/th><th>Leaves when<\/th><th>To<\/th><\/tr><\/thead><tbody><tr><td>closed<\/td><td>start; a close completes; an open fails<\/td><td><code>open<\/code> is called and <code>OP_OPEN<\/code> was sent<\/td><td>opening<\/td><\/tr><tr><td>opening<\/td><td><code>OP_OPEN<\/code> was sent<\/td><td>the ACK of open arrives<\/td><td>open<\/td><\/tr><tr><td>opening<\/td><td><\/td><td><code>OPEN_TIMEOUT_MS<\/code> pass without it<\/td><td>closed<\/td><\/tr><tr><td>open<\/td><td>the ACK of open arrived<\/td><td><code>close<\/code> is called and <code>OP_CLOSE<\/code> was sent<\/td><td>closing<\/td><\/tr><tr><td>closing<\/td><td><code>OP_CLOSE<\/code> was sent<\/td><td>the ACK of close arrives, or <code>CLOSE_TIMEOUT_MS<\/code> pass<\/td><td>closed<\/td><\/tr><\/tbody><\/table><\/div>\n<pre class=\"mermaid\">stateDiagram-v2\n    [*] --&gt; closed\n    closed --&gt; opening: open, OP_OPEN sent\n    opening --&gt; open: ACK of open\n    opening --&gt; closed: OPEN_TIMEOUT_MS passed\n    open --&gt; closing: close, OP_CLOSE sent\n    closing --&gt; closed: ACK of close, or CLOSE_TIMEOUT_MS passed<\/pre>\n<h2 id=\"md-timing\">Timing<\/h2>\n<ul><li>A wait for an ACK is one loop: <code>receive<\/code> with the remaining deadline, computed from <code>now<\/code> at the moment <code>OP_OPEN<\/code> or <code>OP_CLOSE<\/code> was sent. A payload that is not the awaited ACK is ignored and the loop goes on with the remaining time.<\/li><li><code>send<\/code> of data awaits nothing.<\/li><\/ul>\n<h2 id=\"md-failure\">Failure<\/h2>\n<ul><li>A <code>line-error<\/code> from <code>transport<\/code> closes the session at once and is reported to the caller.<\/li><li>A call in the wrong state reports <code>already-open<\/code> or <code>not-open<\/code> and changes nothing.<\/li><\/ul>"}, "session/AGENTS.md": {"unit": "session", "kind": "other", "title": "AGENTS.md: session", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#session\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>\n<h2 id=\"md-documents\">Documents<\/h2>\n<div class=\"table\"><table><thead><tr><th>Kind<\/th><th>Files<\/th><\/tr><\/thead><tbody><tr><td>Understand<\/td><td><a href=\"#session@doc:docs/explanation/context.md\">context<\/a>, <a href=\"#session@doc:docs/explanation/invariants.md\">invariants<\/a>, <a href=\"#session@doc:docs/explanation/runtime.md\">runtime<\/a>, <a href=\"#session@doc:docs/decisions/index.md\">decisions<\/a><\/td><\/tr><\/tbody><\/table><\/div>"}, "transport/README.md": {"unit": "transport", "kind": "readme", "title": "transport", "html": "<p>Moves payloads over the serial line, one frame each way at a time, and hands the session whole payloads. It is the only part of the program that touches the port.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>Two pieces of knowledge live here, and they change for different reasons: how the port is opened, written and read with deadlines, and how a stream of bytes is cut into frames again. The second is a calculation that a test can feed byte by byte, so it is a unit of its own, <code>framing<\/code>, and the port is <code>serial<\/code>. Together they are one adapter to the outside world, and nothing above them sees a byte.<\/p>", "intro": "Moves payloads over the serial line, one frame each way at a time, and hands the session whole payloads. It is the only part of the program that touches the port.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>Two pieces of knowledge live here, and they change for different reasons: how the port is opened, written and read with deadlines, and how a stream of bytes is cut into frames again. The second is a calculation that a test can feed byte by byte, so it is a unit of its own, <code>framing<\/code>, and the port is <code>serial<\/code>. Together they are one adapter to the outside world, and nothing above them sees a byte.<\/p>"}, "transport/docs/decisions/0001-the-line-is-one-unit-cut-into-port-and-reassembly.md": {"unit": "transport", "kind": "decisions", "title": "The line is one unit, cut into the port and the reassembly", "html": "<h2 id=\"md-context-and-problem-statement\">Context and Problem Statement<\/h2>\n<p>The session needs payloads to travel over the line. Where does the knowledge of the port, its deadlines and the cutting of the byte stream into frames live?<\/p>\n<h2 id=\"md-considered-options\">Considered Options<\/h2>\n<ul><li>One adapter unit that does everything between the session and the port<\/li><li>An adapter for the port and a logic unit for the reassembly, together one composite adapter<\/li><li>Reassembly inside the codec<\/li><\/ul>\n<h2 id=\"md-decision-outcome\">Decision Outcome<\/h2>\n<p>Chosen option: &quot;a composite of port and reassembly&quot;, because the reassembly is a calculation that tests feed byte by byte and that a fake of the port would only obscure, while the port is the one place with side effects. The codec stays a layout: where a frame starts in a stream is a policy of the line, not of the layout.<\/p>\n<h3 id=\"md-consequences\">Consequences<\/h3>\n<ul><li>Good: the reassembly is tested without a port, with every split of a stream.<\/li><li>Good: the port unit is small, and its contract tests run against the fake and the real port.<\/li><li>Bad: one more unit and one more contract.<\/li><\/ul>", "status": "proposed", "facts": [["status", "<span class=\"badge proposed\">proposed<\/span>"], ["date", "2026-10-27"]]}, "transport/docs/decisions/0002-a-read-polls-the-port-for-50-ms.md": {"unit": "transport", "kind": "decisions", "title": "A read polls the port for 50 ms", "html": "<h2 id=\"md-context-and-problem-statement\">Context and Problem Statement<\/h2>\n<p><code>receive<\/code> waits for a complete frame until a deadline. The port's <code>read<\/code> takes a timeout. The sources say nothing about how long one read may block.<\/p>\n<h2 id=\"md-considered-options\">Considered Options<\/h2>\n<ul><li>One read with the whole remaining deadline<\/li><li>Reads of <code>READ_POLL_MS<\/code> until the deadline<\/li><\/ul>\n<h2 id=\"md-decision-outcome\">Decision Outcome<\/h2>\n<p>Chosen option: &quot;reads of 50 ms&quot;, because a read that blocks for the whole deadline cannot be stopped when a frame completes early from bytes already in the buffer, and 50 ms keeps the loop cheap.<\/p>\n<h3 id=\"md-consequences\">Consequences<\/h3>\n<ul><li>Good: <code>receive<\/code> returns within 50 ms of a complete frame.<\/li><li>Bad: up to ten reads per <code>OPEN_TIMEOUT_MS<\/code>.<\/li><\/ul>", "status": "proposed", "facts": [["status", "<span class=\"badge proposed\">proposed<\/span>"], ["date", "2026-10-27"]]}, "transport/docs/decisions/index.md": {"unit": "transport", "kind": "decisions", "title": "Decisions of transport", "html": "<p><a href=\"#transport\">README.md<\/a> · <a href=\"#transport@doc:AGENTS.md\">AGENTS.md<\/a><\/p>\n<p>Accepted and derived decisions bind.<\/p>\n<div class=\"table\"><table><thead><tr><th>No.<\/th><th>Decision<\/th><th>Status<\/th><th>Date<\/th><\/tr><\/thead><tbody><tr><td>0001<\/td><td><a href=\"#transport@doc:docs/decisions/0001-the-line-is-one-unit-cut-into-port-and-reassembly.md\">The line is one unit, cut into the port and the reassembly<\/a><\/td><td><strong>proposed: not accepted, does not bind<\/strong><\/td><td>2026-10-27<\/td><\/tr><tr><td>0002<\/td><td><a href=\"#transport@doc:docs/decisions/0002-a-read-polls-the-port-for-50-ms.md\">A read polls the port for 50 ms<\/a><\/td><td><strong>proposed: not accepted, does not bind<\/strong><\/td><td>2026-10-27<\/td><\/tr><\/tbody><\/table><\/div>"}, "transport/docs/references/framing.md": {"unit": "transport", "kind": "references", "title": "framing", "html": "<p>Contract of <code>framing.framing<\/code>, cutting the byte stream of the line into frames. Notation: wit.\nSources: proto §4.3<\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-feed\">feed<\/h3>\n<p class=field><strong>Kind:<\/strong> query<\/p>\n<pre><code class=\"language-wit\">feed: func(buffer: list&lt;u8&gt;, incoming: list&lt;u8&gt;) -&gt; fed;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> <code>len(buffer) + len(incoming) &lt;= MAX_BUFFER_BYTES + MAX_PAYLOAD + 3<\/code>.<\/p>\n<p class=field><strong>Result:<\/strong> every complete valid frame at the start of <code>buffer<\/code> followed by <code>incoming<\/code>, in order; <code>rest<\/code> holds the bytes after the last frame, starting at a magic byte or empty; bytes before a magic byte and the bytes of a frame with a wrong CRC are dropped and counted in <code>dropped<\/code>. When <code>rest<\/code> would exceed <code>MAX_BUFFER_BYTES<\/code>, its oldest bytes are dropped.<\/p>\n<p class=field><strong>Errors:<\/strong> none.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>one frame, proto §4.2<\/td><td><code>feed([], [1F, 01, 81, 9B])<\/code><\/td><td>frames <code>[[81]]<\/code>, rest <code>[]<\/code>, dropped 0<\/td><\/tr><tr><td>garbage first, proto §4.3<\/td><td><code>feed([], [00, FF, 1E, 1F, 01, 81, 9B])<\/code><\/td><td>frames <code>[[81]]<\/code>, rest <code>[]<\/code>, dropped 3<\/td><\/tr><tr><td>two frames<\/td><td><code>feed([], [1F, 01, 81, 9B, 1F, 00, 00])<\/code><\/td><td>frames <code>[[81], []]<\/code>, rest <code>[]<\/code>, dropped 0<\/td><\/tr><tr><td>split frame<\/td><td><code>feed([1F, 01], [81, 9B])<\/code><\/td><td>frames <code>[[81]]<\/code>, rest <code>[]<\/code>, dropped 0<\/td><\/tr><tr><td>incomplete<\/td><td><code>feed([], [1F, 01, 81])<\/code><\/td><td>frames <code>[]<\/code>, rest <code>[1F, 01, 81]<\/code>, dropped 0<\/td><\/tr><tr><td>wrong CRC, proto §4.3<\/td><td><code>feed([], [1F, 01, 81, 00, 1F, 00, 00])<\/code><\/td><td>frames <code>[[]]<\/code>, rest <code>[]<\/code>, dropped 4<\/td><\/tr><tr><td>buffer full<\/td><td><code>feed(1024 bytes without a magic byte, [1F])<\/code><\/td><td>frames <code>[]<\/code>, rest <code>[1F]<\/code>, dropped 1024<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-fed\">fed<\/h3>\n<p class=field><strong>Kind:<\/strong> type<\/p>\n<pre><code class=\"language-wit\">record fed { frames: list&lt;list&lt;u8&gt;&gt;, rest: list&lt;u8&gt;, dropped: u32 }<\/code><\/pre>\n<div class=\"table\"><table><thead><tr><th>Field<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>frames<\/td><td>the payloads of the complete valid frames, in order<\/td><\/tr><tr><td>rest<\/td><td>the bytes to keep for the next call<\/td><\/tr><tr><td>dropped<\/td><td>how many bytes were thrown away<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>The real implementation: a pure function over two byte lists, and its user produces every split of a stream that no table can list.<\/p>"}, "transport/AGENTS.md": {"unit": "transport", "kind": "other", "title": "AGENTS.md: transport", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#transport\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>\n<h2 id=\"md-documents\">Documents<\/h2>\n<div class=\"table\"><table><thead><tr><th>Kind<\/th><th>Files<\/th><\/tr><\/thead><tbody><tr><td>Look up<\/td><td><a href=\"#transport@doc:docs/references/framing.md\">framing<\/a><\/td><\/tr><tr><td>Understand<\/td><td><a href=\"#transport@doc:docs/decisions/index.md\">decisions<\/a><\/td><\/tr><\/tbody><\/table><\/div>"}, "transport/framing/README.md": {"unit": "transport/framing", "kind": "readme", "title": "framing", "html": "<p>Takes the bytes kept from the last read and the bytes just read, and returns the complete frames in them and the bytes to keep. A pure calculation.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>A byte stream can start in the middle of a frame, carry garbage, or hold two frames at once, and the port cannot be made to deliver these cases on demand. As a function over two byte lists, every case is one table row. The unit asks the codec whether the bytes at a magic byte are a frame; it does not know the layout itself.<\/p>", "intro": "Takes the bytes kept from the last read and the bytes just read, and returns the complete frames in them and the bytes to keep. A pure calculation.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>A byte stream can start in the middle of a frame, carry garbage, or hold two frames at once, and the port cannot be made to deliver these cases on demand. As a function over two byte lists, every case is one table row. The unit asks the codec whether the bytes at a magic byte are a frame; it does not know the layout itself.<\/p>"}, "transport/framing/docs/decisions/0001-bytes-before-a-magic-byte-are-dropped.md": {"unit": "transport/framing", "kind": "decisions", "title": "Bytes before a magic byte are dropped", "html": "<h2 id=\"md-source-says\">Source says<\/h2>\n<p>Proto §4.3: a receiver reads the line as a stream of bytes and discards every byte until it sees a magic byte, then reads the length, the payload and the CRC. A payload byte that equals the magic byte is part of the payload, because the length says how many bytes follow. A frame with a wrong CRC is invalid; the device drops it and waits for the next magic byte.<\/p>\n<h2 id=\"md-context-and-problem-statement\">Context and Problem Statement<\/h2>\n<p>The unit needs a rule for garbage, for a frame cut in two, and for a frame with a wrong CRC.<\/p>\n<h2 id=\"md-decision-outcome\">Decision Outcome<\/h2>\n<p>Chosen option: &quot;as §4.3 says, and keep at most <code>MAX_BUFFER_BYTES<\/code>&quot;, because the source settles the dropping; the buffer limit is the one addition, so that a line that never sends a magic byte cannot grow the buffer without bound.<\/p>\n<h3 id=\"md-consequences\">Consequences<\/h3>\n<ul><li>Good: the host and the device agree on what a frame is after garbage.<\/li><li>Bad: a frame longer than the buffer limit can never be received; none is, since <code>MAX_PAYLOAD<\/code> is 255.<\/li><\/ul>", "status": "derived", "facts": [["status", "<span class=\"badge derived\">derived<\/span>"], ["date", "2026-10-27"], ["derived from", "proto §4.3"]]}, "transport/framing/docs/decisions/index.md": {"unit": "transport/framing", "kind": "decisions", "title": "Decisions of framing", "html": "<p><a href=\"#transport/framing\">README.md<\/a> · <a href=\"#transport/framing@doc:AGENTS.md\">AGENTS.md<\/a><\/p>\n<p>Accepted and derived decisions bind.<\/p>\n<div class=\"table\"><table><thead><tr><th>No.<\/th><th>Decision<\/th><th>Status<\/th><th>Date<\/th><\/tr><\/thead><tbody><tr><td>0001<\/td><td><a href=\"#transport/framing@doc:docs/decisions/0001-bytes-before-a-magic-byte-are-dropped.md\">Bytes before a magic byte are dropped<\/a><\/td><td><strong>derived: a source settles it; binds until a person accepts it<\/strong><\/td><td>2026-10-27<\/td><\/tr><\/tbody><\/table><\/div>"}, "transport/framing/AGENTS.md": {"unit": "transport/framing", "kind": "other", "title": "AGENTS.md: framing", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#transport/framing\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>\n<h2 id=\"md-documents\">Documents<\/h2>\n<div class=\"table\"><table><thead><tr><th>Kind<\/th><th>Files<\/th><\/tr><\/thead><tbody><tr><td>Understand<\/td><td><a href=\"#transport/framing@doc:docs/decisions/index.md\">decisions<\/a><\/td><\/tr><\/tbody><\/table><\/div>"}, "transport/serial/README.md": {"unit": "transport/serial", "kind": "readme", "title": "serial", "html": "<p>Writes a frame to the port and reads the port until a whole frame is there or the deadline has passed. The only unit that calls the port.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>Every side effect of the line is here and nowhere else, so the rest of the program is tested with a port in memory and this unit alone runs its contract tests against the real port too. It keeps the bytes that arrived after the last frame and gives them to <code>framing<\/code> with the next read; it does not know what a frame looks like inside.<\/p>", "intro": "Writes a frame to the port and reads the port until a whole frame is there or the deadline has passed. The only unit that calls the port.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>Every side effect of the line is here and nowhere else, so the rest of the program is tested with a port in memory and this unit alone runs its contract tests against the real port too. It keeps the bytes that arrived after the last frame and gives them to <code>framing<\/code> with the next read; it does not know what a frame looks like inside.<\/p>"}, "transport/serial/AGENTS.md": {"unit": "transport/serial", "kind": "other", "title": "AGENTS.md: serial", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#transport/serial\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>"}}, "base": "", "up": ""};
const MERMAID = {"url": "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"};
const units = model.units, byPath = Object.fromEntries(units.map(u => [u.path, u]));
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const file = p => model.base ? model.base + "/" + p.split("/").map(encodeURIComponent).join("/") : model.up + p.split("/").map(encodeURIComponent).join("/");
const badge = s => s && s !== "active" && s !== "accepted" ? ` <span class="badge ${esc(s.split(" ")[0])}">${esc(s)}</span>` : "";
const pick = (p, t) => `<a class="go" data-path="${esc(p)}">${esc(t ?? (p === "." ? model.name : p))}</a>` + badge(byPath[p] && byPath[p].status);
const docs = model.docs || {}, KINDS = {readme: "README", tutorials: "Tutorials", contracts: "Contracts", references: "Reference", explanation: "Explanation", decisions: "Decisions", skills: "Skills", other: "Other"};
const enc = s => encodeURIComponent(s).replace(/%(2F|40|3A)/g, m => decodeURIComponent(m));   // a route stays readable: unit@doc:docs/references/x.md
const hashOf = (route, anchor) => "#" + enc(route) + (anchor ? "#" + encodeURIComponent(anchor) : "");
const pageOf = p => { const d = docs[p]; return d && d.unit + "@doc:" + (d.unit === "." ? p : p.slice(d.unit.length + 1)); };   // the page of a document
const routeOf = p => docs[p] && docs[p].kind === "readme" ? docs[p].unit : pageOf(p);   // a link to a README opens its unit
const href = v => { const [p, a] = v.split("#"), r = routeOf(p); return r ? hashOf(r, a) : file(p) + (a ? "#" + encodeURIComponent(a) : ""); };   // a document opens here, any other file as it is
const ref = v => v ? (/^[a-z][a-z0-9+.-]*:/i.test(v) ? `<a href="${esc(v)}">${esc(v)}</a>` : `<a href="${esc(href(v))}">${esc(v)}</a>`) : "";
const part = (contract, name) => { const dir = contract.endsWith("/index.md") && contract.slice(0, -8) + name + ".md";   // a part: its file in a folder contract, its heading in a file
  return `<a href="${esc(href(dir && docs[dir] ? dir : contract + "#" + name))}">${esc(name)}</a>`; };
const title = p => docs[p].title || esc(p.split("/").pop().replace(/\.md$/, ""));
