nicode"}}}}, {"unit": "core", "path": "core", "summary": "Makes slugs and defines what a transliteration plug-in must offer", "kind": "library", "status": "active", "owner": "", "manifest": "core/unit.yaml", "parent": ".", "children": [], "provides": {"slugify": {"kind": "library", "summary": "Turn a string into a slug with a chosen separator and length", "contract": "src/lib.rs", "verified-by": "tests", "conforms-to": null, "used-by": [{"outside": true, "root-port": "slugify"}, {"unit": "cli", "need": "slugify", "contract": null}]}, "plugin-api": {"kind": "specification", "summary": "The interface a transliteration plug-in implements", "contract": "src/lib.rs", "verified-by": "tests", "conforms-to": null, "used-by": [{"unit": "plugins/unicode", "need": "plugin-api", "contract": null}]}}, "needs": {}, "skills": [], "decisions": [], "files": ["core/README.md"], "readme": "core/README.md", "agents": "core/AGENTS.md", "diagrams": {"context": {"source": "flowchart LR\n  subgraph u_root[\"slugline\"]\n    u_cli[\"cli\"]\n    u_core[\"core\"]\n    u_plugins__unicode[\"unicode\"]\n  end\n  p_root___slugify([\"slugify\"])\n  p_root___slugify --> u_core\n  u_cli -->|\"slugify\"| u_core\n  u_plugins__unicode -->|\"plugin-api\"| u_core\n  classDef focus stroke-width:4px\n  classDef planned stroke-dasharray:6 4\n  classDef plain stroke-dasharray:2 3\n  class u_core focus", "nodes": {"u_root": ".", "u_cli": "cli", "u_core": "core", "u_plugins__unicode": "plugins/unicode"}}}}, {"unit": "unicode", "path": "plugins/unicode", "summary": "Transliterates Latin characters with diacritics to ASCII", "kind": "library", "status": "active", "owner": "", "manifest": "plugins/unicode/unit.yaml", "parent": ".", "children": [], "provides": {"transliteration": {"kind": "library", "summary": "Maps characters outside ASCII to ASCII before a slug is made", "contract": null, "verified-by": "tests", "conforms-to": "plugin-api", "used-by": [{"unit": "cli", "need": "transliteration", "contract": null} const units = model.units, byPath = Object.fromEntries(units.map(u => [u.path, u]));
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const file = p => model.base ? model.base + "/" + p : model.up + p;
const pick = (p, t) => `<a class="go" data-path="${esc(p)}">${esc(t ?? (p === "." ? model.name : p))}</a>`;
let mermaid = null, state = {path: ".", kind: null};
function fromHash(){const h = decodeURIComponent(location.hash.slice(1)); const [p, k] = h.split("@");
  state = {path: byPath[p] ? p : ".", kind: k || null};}
function go(path, kind){location.hash = encodeURIComponent(path + (kind ? "@" + kind : ""));}
function tree(path){const u = byPath[path]; const kids = u.children.map(tree).join("");
  return `<li><a data-path="${esc(path)}" class="go${path === state.path ? " on" : ""}">${esc(u.unit)}</a>${kids ? "<ul>" + kids + "</ul>" : ""}</li>`;}
function who(list, key){return list.map(i => i.outside ? "outside the project"
  : i["plain-folder"] ? "folder <code>" + esc(i["plain-folder"]) + "</code>"
  : pick(i.unit) + " · <code>" + esc(i[key]) + "</code>" + (i.config ? " (" + esc(i.config) + ")" : "")).join("<br>") || "–";}

  el("tree").innerHTML = "<ul>" + tree(".") + "</ul>";
  const chain = []; for (let p = u.parent; p !== null; p = byPath[p].parent) chain.unshift(p);
  el("crumbs").innerHTML = chain.map(p => pick(p, byPath[p].unit)).concat(esc(u.unit)).join(" / ");

    for (const node of el("diagram").querySelectorAll("[id]")) {
      const hit = Object.keys(d.nodes).find(id => node.id === id || new RegExp("(^|-)" + id + "(-\\d+)?$").test(node.id));

  const a = ev.target.closest(".go"); if (a) { go(a.dataset.path); return; }
