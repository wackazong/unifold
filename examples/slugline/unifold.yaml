# yaml-language-server: $schema=https://unifold.md/0.3/unifold.schema.json
unifold: "0.3"
name: slugline
responsibility: Turns text into URL slugs, as a Rust library and as a command
not:
  - unique slugs; nothing here knows which slugs exist already
  - scripts other than Latin; a Cyrillic or Greek table is another plug-in
  - a configuration file or locale for the command
capabilities:
  slugify:
    kind: library
    summary: Turn a string into a slug
    contract: docs/references/slugify.md
  plugin-api:
    kind: library
    summary: The trait through which a caller supplies transliteration
    contract: docs/references/plugin-api.md
  slugline-command:
    kind: cli
    summary: Slugs from arguments or from the lines of standard input
    contract: docs/references/slugline-command.md
wiring:
  slugify: core.slugify
  plugin-api: core.plugin-api
  slugline-command: cli.slugline-command
  cli.slugify: core.slugify
  cli.transliteration: unicode.transliteration
  unicode.plugin-api: core.plugin-api
scenarios:
  slug-from-arguments:
    summary: The command turns its arguments into one slug with the plug-in
    source: the README of the command
    hops:
      - slugline-command -> cli.slugline
      - cli -> core.slugify-with
      - cli -> plugins/unicode.transliterate
      - plugins/unicode -> core.transliterate
    expect: "`slugline Crème brûlée` prints `creme-brulee` and exits with 0"
  library-call:
    summary: A program calls the library with a plug-in of its own
    source: the tests of core
    hops:
      - slugify -> core.slugify-with
      - plugin-api -> core.transliterate
    expect: "`slugify_with(\"Straße\", &Options::default(), &plugin)` returns `strasse` when the plug-in answers `ss` for `ß`"
