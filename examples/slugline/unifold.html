th(\"Straße\", &Options::default(), &plugin)` returns `strasse` when the plug-in answers `ss` for `ß`", "hops": [{"caller": "slugify", "target": "core", "part": "slugify-with", "part-kind": "query", "contract": "docs/references/slugify.md", "caller-unit": null, "target-unit": "core", "via": [{"unit": ".", "key": "slugify"}], "part-file": "docs/references/slugify.md"}, {"caller": "plugin-api", "target": "core", "part": "transliterate", "part-kind": "type", "contract": "docs/references/plugin-api.md", "caller-unit": null, "target-unit": "core", "via": [{"unit": ".", "key": "plugin-api"}], "part-file": "docs/references/plugin-api.md"}], "x": {}, "unit": ".", "page": "docs/diagrams/scenario-library-call.md", "diagram": {"source": "---\nconfig:\n  sequence:\n    height: 108\n---\nsequenceDiagram\n  participant pslugify as slugify<br/>«library»<br/>Turn a string into a slug\n  participant pcore as core<br/>«logic»<br/>Makes slugs and defines what a<br/>transliteration plug-in must<br/>provide\n  participant pplugin_dapi as plugin-api<br/>«library»<br/>The trait through which a caller<br/>supplies transliteration\n  pslugify->>pcore: 1 · slugify-with\n  activate pcore\n  pcore-->>pslugify: ↩ 1\n  deactivate pcore\n  pplugin_dapi->>pcore: 2 · transliterate\n  Note over pslugify,pplugin_dapi: wrap: Expect: `slugify_with(#quot;Straße#quot;, &Options::default(), &plugin)` returns `strasse` when the plug-in answers `ss` for `ß`", "lifelines": {"pslugify": {"name": "slugify", "unit": ".", "side": "capability", "entry": "slugify"}, "pcore": {"name": "core", "unit": "core"}, "pplugin_dapi": {"name": "plugin-api", "unit": ".", "side": "capability", "entry": "plugin-api"}}}}], "docs": {"README.md": {"unit": ".", "kind": "readme", "title": "slugline", "html": "<p>Turns text into a URL slug: <code>Crème brûlée<\/code> becomes <code>creme-brulee<\/code>. A Rust library and a command, in a small Cargo workspace of three crates, for anyone who needs stable, readable identifiers from free text. It is also the small showcase of <a href=\"https://unifold.md\">unifold<\/a>: four units with code and tests, and a map of them in four manifests.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>A slug has to be the same forever once it is in a URL, so the rules that make one are concentrated in one crate and tested as a contract, while the part that is a matter of taste, which letters replace <code>é<\/code> or <code>ß<\/code>, is a plug-in behind a trait. The command is a thin shell over the library. As an example of unifold, the workspace is cut so that every kind of connection appears once; the <a href=\"#.@component\">component diagram<\/a> shows them. Each child has a short <code>README.md<\/code>, and <code>core<\/code> also has a decision, invariants and a context item, so a reader can see the smallest unit and a complete one side by side.<\/p>\n<h2 id=\"md-commands\">Commands<\/h2>\n<pre><code class=\"language-sh\">cargo test --workspace\nalias unifold='uv run ../../docs/skills/unifold/scripts/unifold.py'\nunifold check<\/code><\/pre>\n<h2 id=\"md-read-next\">Read next<\/h2>\n<ol><li><a href=\"#.@doc:docs/tutorials/three-commands.md\">Three commands<\/a>: what <code>check<\/code>, <code>show<\/code> and <code>capability<\/code> print for this project.<\/li><li><a href=\"#.@doc:docs/tutorials/break-the-map.md\">Break the map<\/a>: what <code>check<\/code> says when a wiring line is missing or the two sides of a connection name different contracts.<\/li><li>The generated <a href=\"#.@component\">component diagram<\/a>, or <code>unifold.html<\/code> in a browser.<\/li><li><a href=\"#core\">core<\/a>, the child with a decision, invariants and a context item.<\/li><\/ol>", "intro": "Turns text into a URL slug: <code>Crème brûlée<\/code> becomes <code>creme-brulee<\/code>. A Rust library and a command, in a small Cargo workspace of three crates, for anyone who needs stable, readable identifiers from free text. It is also the small showcase of <a href=\"https://unifold.md\">unifold<\/a>: four units with code and tests, and a map of them in four manifests.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>A slug has to be the same forever once it is in a URL, so the rules that make one are concentrated in one crate and tested as a contract, while the part that is a matter of taste, which letters replace <code>é<\/code> or <code>ß<\/code>, is a plug-in behind a trait. The command is a thin shell over the library. As an example of unifold, the workspace is cut so that every kind of connection appears once; the <a href=\"#.@component\">component diagram<\/a> shows them. Each child has a short <code>README.md<\/code>, and <code>core<\/code> also has a decision, invariants and a context item, so a reader can see the smallest unit and a complete one side by side.<\/p>"}, "docs/references/plugin-api.md": {"unit": ".", "kind": "references", "title": "plugin-api", "html": "<p>Contract of <code>core.plugin-api<\/code>: the trait a transliteration plug-in implements. The call that uses a plug-in, <code>slugify-with<\/code>, is a part of <a href=\"#.@doc:docs/references/slugify.md\">slugify<\/a>. Notation: wit.\nSources: the tests of <code>core<\/code><\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-transliterate\">transliterate<\/h3>\n<p class=field><strong>Kind:<\/strong> type<\/p>\n<pre><code class=\"language-wit\">resource transliterate {\n  transliterate: func(c: char) -&gt; option&lt;string&gt;;\n}<\/code><\/pre>\n<div class=\"table\"><table><thead><tr><th>Rule<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>input<\/td><td><code>c<\/code> is a character outside ASCII; the plug-in is never asked about an ASCII character<\/td><\/tr><tr><td>answer<\/td><td>ASCII text that is treated like typed text: empty, one letter or several letters, and it goes through the slug rules of <a href=\"#.@doc:docs/references/slugify.md\">slugify<\/a><\/td><\/tr><tr><td><code>none<\/code><\/td><td>&quot;I do not know this character&quot;: the character is dropped<\/td><\/tr><tr><td>purity<\/td><td>an implementation has no side effects and gives the same answer for the same character<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>The real implementation: a plug-in is a table, and a consumer's test passes a table of its own with the answers it needs.<\/p>"}, "docs/references/slug.md": {"unit": ".", "kind": "references", "title": "Slug", "html": "<p>What every part of slugline means by a slug.<\/p>\n<h2 id=\"md-format\">Format<\/h2>\n<ul><li>A slug consists of the letters <code>a<\/code> to <code>z<\/code>, the digits <code>0<\/code> to <code>9<\/code> and one separator character, by default <code>-<\/code>.<\/li><li>Exactly one separator stands between two words. None stands at the start or at the end.<\/li><li>A slug may be empty: text without a letter or digit has the slug <code>&quot;&quot;<\/code>.<\/li><\/ul>"}, "docs/references/slugify.md": {"unit": ".", "kind": "references", "title": "slugify", "html": "<p>Contract of <code>core.slugify<\/code>: a function that turns one string into one slug, with or without a plug-in. What a slug is, is in <a href=\"#.@doc:docs/references/slug.md\">slug.md<\/a>. Notation: wit.\nSources: the tests of <code>core<\/code><\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-slugify-1\">slugify<\/h3>\n<p class=field><strong>Kind:<\/strong> query<\/p>\n<pre><code class=\"language-wit\">slugify: func(input: string, options: options) -&gt; string;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> none.<\/p>\n<p class=field><strong>Result:<\/strong> a slug as <a href=\"#.@doc:docs/references/slug.md\">slug.md<\/a> defines it. Letters and digits of ASCII are kept, in lower case. An apostrophe is dropped. Any other ASCII character ends a word. A character outside ASCII is dropped. Exactly one separator stands between two words, none at the start or the end, also after a cut at <code>max-len<\/code>. The result has at most <code>max-len<\/code> characters. A slug is its own slug.<\/p>\n<p class=field><strong>Errors:<\/strong> none.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>punctuation ends a word<\/td><td><code>slugify(&quot;Hello, World!&quot;, default)<\/code><\/td><td><code>hello-world<\/code><\/td><\/tr><tr><td>several spaces<\/td><td><code>slugify(&quot;two   words&quot;, default)<\/code><\/td><td><code>two-words<\/code><\/td><\/tr><tr><td>apostrophe dropped<\/td><td><code>slugify(&quot;Rock 'n' Roll&quot;, default)<\/code><\/td><td><code>rock-n-roll<\/code><\/td><\/tr><tr><td>own separator<\/td><td><code>slugify(&quot;Hello, World!&quot;, {separator: &quot;_&quot;})<\/code><\/td><td><code>hello_world<\/code><\/td><\/tr><tr><td>cut at the limit<\/td><td><code>slugify(&quot;Hello, World!&quot;, {max-len: 6})<\/code><\/td><td><code>hello<\/code><\/td><\/tr><tr><td>diacritics dropped<\/td><td><code>slugify(&quot;Crème brûlée&quot;, default)<\/code><\/td><td><code>crme-brle<\/code><\/td><\/tr><tr><td>a slug is its own slug<\/td><td><code>slugify(&quot;hello-world&quot;, default)<\/code><\/td><td><code>hello-world<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-slugify-with\">slugify-with<\/h3>\n<p class=field><strong>Kind:<\/strong> query<\/p>\n<pre><code class=\"language-wit\">slugify-with: func(input: string, options: options, plugin: borrow&lt;transliterate&gt;) -&gt; string;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> none.<\/p>\n<p class=field><strong>Result:<\/strong> a slug like <code>slugify<\/code>, where every character outside ASCII is first given to the plug-in; its answer goes through the slug rules like typed text, and <code>none<\/code> drops the character.<\/p>\n<p class=field><strong>Errors:<\/strong> none.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>letters replaced<\/td><td><code>slugify-with(&quot;Crème brûlée&quot;, default, latin)<\/code> where latin answers <code>è<\/code>→<code>e<\/code>, <code>û<\/code>→<code>u<\/code>, <code>é<\/code>→<code>e<\/code><\/td><td><code>creme-brulee<\/code><\/td><\/tr><tr><td>one letter becomes two<\/td><td><code>slugify-with(&quot;Straße&quot;, default, latin)<\/code> where latin answers <code>ß<\/code>→<code>ss<\/code><\/td><td><code>strasse<\/code><\/td><\/tr><tr><td>plug-in does not know<\/td><td><code>slugify-with(&quot;naïve&quot;, default, latin)<\/code> where latin answers <code>ï<\/code>→<code>none<\/code><\/td><td><code>nave<\/code><\/td><\/tr><tr><td>empty answer<\/td><td><code>slugify-with(&quot;a→b&quot;, default, latin)<\/code> where latin answers <code>→<\/code>→<code>&quot;&quot;<\/code><\/td><td><code>ab<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"md-options\">options<\/h3>\n<p class=field><strong>Kind:<\/strong> type<\/p>\n<pre><code class=\"language-wit\">record options { separator: char, max-len: option&lt;u32&gt; }<\/code><\/pre>\n<div class=\"table\"><table><thead><tr><th>Field<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>separator<\/td><td>one character between words; default <code>-<\/code><\/td><\/tr><tr><td>max-len<\/td><td>the most characters a slug may have; default none<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>The real implementation: the function is pure, and its users produce inputs that no table can list.<\/p>"}, "docs/references/slugline-command.md": {"unit": ".", "kind": "references", "title": "slugline-command", "html": "<p>Contract of <code>cli.slugline-command<\/code>: the command <code>slugline<\/code>. Notation: usage text.\nSources: the tests of <code>cli<\/code><\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-slugline\">slugline<\/h3>\n<p class=field><strong>Kind:<\/strong> command<\/p>\n<pre><code class=\"language-text\">slugline [OPTIONS] [TEXT]...\n  -s, --separator CHAR   one ASCII symbol between words; default -\n  -m, --max-len N        cut the slug after N characters\n      --ascii            drop letters with diacritics instead of replacing them\n  -h, --help             print the usage and exit with 0\n  --                     everything after it is text<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> none.<\/p>\n<p class=field><strong>Result:<\/strong> with <code>TEXT<\/code>, the arguments joined by one space as one slug, then a newline, on standard output. Without <code>TEXT<\/code>, one slug for each line of standard input, in the order of the lines. Exit code 0 when a slug was printed for every input.<\/p>\n<p class=field><strong>Errors:<\/strong> exit 1 when standard input or output failed, with a message that starts with <code>slugline:<\/code>; exit 2 when an option is unknown or has no valid value, with the usage after the message.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>arguments with diacritics<\/td><td><code>slugline Crème brûlée<\/code><\/td><td><code>creme-brulee<\/code>, exit 0<\/td><\/tr><tr><td>ascii only<\/td><td><code>slugline --ascii Crème brûlée<\/code><\/td><td><code>crme-brle<\/code>, exit 0<\/td><\/tr><tr><td>own separator<\/td><td><code>slugline -s _ Hello World<\/code><\/td><td><code>hello_world<\/code>, exit 0<\/td><\/tr><tr><td>lines of standard input<\/td><td><code>printf 'a b\\nc d\\n' | slugline<\/code><\/td><td><code>a-b<\/code> and <code>c-d<\/code> on two lines, exit 0<\/td><\/tr><tr><td>bad separator<\/td><td><code>slugline -s ab x<\/code><\/td><td>exit 2, <code>slugline: the separator must be one ASCII symbol, not 'ab'<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>Replays the examples: a test of the command runs the binary with the input of a row and compares output and exit code. Faults it can inject: none.<\/p>"}, "docs/references/transliteration.md": {"unit": ".", "kind": "references", "title": "transliteration", "html": "<p>Contract of <code>unicode.transliteration<\/code>: a plug-in that replaces Latin letters with diacritics, and ligatures, by ASCII letters. It implements the trait of <a href=\"#.@doc:docs/references/plugin-api.md\">plugin-api<\/a>. Notation: wit.\nSources: the Unicode blocks Latin-1 Supplement and Latin Extended-A<\/p>\n<h2 id=\"md-parts\">Parts<\/h2>\n<h3 id=\"md-transliterate\">transliterate<\/h3>\n<p class=field><strong>Kind:<\/strong> query<\/p>\n<pre><code class=\"language-wit\">transliterate: func(c: char) -&gt; option&lt;string&gt;;<\/code><\/pre>\n<p class=field><strong>Pre:<\/strong> <code>c<\/code> is outside ASCII.<\/p>\n<p class=field><strong>Result:<\/strong> every letter of the Unicode blocks Latin-1 Supplement and Latin Extended-A maps to its base letter or letters, in the case of the base letter; ligatures map to two letters: <code>æ<\/code> to <code>ae<\/code>, <code>œ<\/code> to <code>oe<\/code>, <code>ĳ<\/code> to <code>ij<\/code>, <code>ß<\/code> to <code>ss<\/code>, <code>þ<\/code> to <code>th<\/code>; any other character gets <code>none<\/code>.<\/p>\n<p class=field><strong>Errors:<\/strong> none.<\/p>\n<p class=field><strong>Examples:<\/strong> <\/p>\n<div class=\"table\"><table><thead><tr><th>Case<\/th><th>Input<\/th><th>Expected<\/th><\/tr><\/thead><tbody><tr><td>acute accent<\/td><td><code>transliterate('é')<\/code><\/td><td><code>e<\/code><\/td><\/tr><tr><td>stroke, upper case<\/td><td><code>transliterate('Ø')<\/code><\/td><td><code>o<\/code><\/td><\/tr><tr><td>stroke<\/td><td><code>transliterate('ł')<\/code><\/td><td><code>l<\/code><\/td><\/tr><tr><td>ligature, upper case<\/td><td><code>transliterate('Æ')<\/code><\/td><td><code>ae<\/code><\/td><\/tr><tr><td>sharp s<\/td><td><code>transliterate('ß')<\/code><\/td><td><code>ss<\/code><\/td><\/tr><tr><td>an arrow<\/td><td><code>transliterate('→')<\/code><\/td><td><code>none<\/code><\/td><\/tr><tr><td>Cyrillic<\/td><td><code>transliterate('я')<\/code><\/td><td><code>none<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-fake\">Fake<\/h2>\n<p>The real implementation: a table with no side effects, and a consumer that wants other answers passes a table of its own.<\/p>"}, "docs/tutorials/break-the-map.md": {"unit": ".", "kind": "tutorials", "title": "Break the map", "html": "<p>This lesson is for a developer who has done <a href=\"#.@doc:docs/tutorials/three-commands.md\">three commands<\/a>. You break the map twice and read what <code>check<\/code> reports. Work in the folder <code>examples/slugline<\/code>, with <code>unifold<\/code> set as the alias from <a href=\"#.\">README.md<\/a>.<\/p>\n<ol><li><p>Delete the line <code>cli.transliteration: unicode.transliteration<\/code> from <a href=\"unifold.yaml\">unifold.yaml<\/a>.<\/p><\/li><li><p>Run <code>unifold check<\/code>. It reports four errors and a warning:<\/p>\n<pre><code class=\"language-console\">$ unifold check\nerror G1 docs/diagrams/component.md: generated file is out of date\n    fix: Run `unifold generate` (or `unifold check --fix`). A hand-written `AGENTS.md` is not overwritten: move its content to `README.md` and `docs/`, delete it, then run the command.\nerror G1 docs/diagrams/scenario-slug-from-arguments.md: generated file is out of date\n    fix: Run `unifold generate` (or `unifold check --fix`). A hand-written `AGENTS.md` is not overwritten: move its content to `README.md` and `docs/`, delete it, then run the command.\nerror W2 unifold.yaml:22: need 'cli.transliteration' has no provider\n    fix: Add `cli.transliteration: unicode.transliteration` to the wiring.\nwarn W3 unifold.yaml:22: 'unicode.transliteration' is provided but nothing uses it\n    fix: Wire the unit that should use it; where code of the parent itself uses it, declare a need in the parent and wire it (`need: child.capability`); or implement a capability of the parent with it (`capability: child.capability`); or remove the capability.\nerror N1 unifold.yaml:29: scenario 'slug-from-arguments', hop 'cli -&gt; plugins/unicode.transliterate': no need of 'cli' is provided for by 'plugins/unicode'\n    fix: Wire the connection the hop needs, add the part to the contract, or rename what is ambiguous.\n4 unit(s): 4 error(s), 1 warning(s), 0 info  [G1×2, N1×1, W2×1, W3×1]<\/code><\/pre>\n<p><code>W2<\/code> says that the need of <code>cli<\/code> has no provider. <code>W3<\/code> says the same from the other side: nothing uses the capability of <code>unicode<\/code>. <code>N1<\/code> says that the story <code>slug-from-arguments<\/code> can no longer run: its hop from <code>cli<\/code> to the plug-in has no connection to run along. <code>G1<\/code> says that the component diagram and the diagram of that scenario no longer match the manifests.<\/p><\/li><li><p>Put the line back. Run <code>unifold check<\/code>. It prints <code>0 error(s), 0 warning(s)<\/code> again.<\/p><\/li><li><p>In <code>plugins/unicode/unifold.yaml<\/code>, change the contract of the need <code>plugin-api<\/code> to <code>../../docs/references/slug.md<\/code>.<\/p><\/li><li><p>Run <code>unifold check<\/code>. It reports three errors and two warnings:<\/p>\n<pre><code class=\"language-console\">$ unifold check\nerror G1 docs/diagrams/scenario-slug-from-arguments.md: generated file is out of date\n    fix: Run `unifold generate` (or `unifold check --fix`). A hand-written `AGENTS.md` is not overwritten: move its content to `README.md` and `docs/`, delete it, then run the command.\nwarn C1 docs/references/slug.md: no `## Parts` section; a contract lists its parts, one `###` heading each\n    fix: Write the parts as [writing.md](writing.md#contracts) says.\nwarn C5 docs/references/slug.md: no `## Fake` section: say what stands in for this contract in the tests of its consumers\n    fix: Say what stands in for the contract in the tests of its consumers.\nerror W11 unifold.yaml:28: need 'unicode.plugin-api' names the contract docs/references/slug.md, capability 'core.plugin-api' names docs/references/plugin-api.md\n    fix: Write the definition as a reference of this unit, the one that holds the wiring, or of a unit above it, and point both sides at it with `contract`.\nerror N1 unifold.yaml:30: scenario 'slug-from-arguments', hop 'plugins/unicode -&gt; core.transliterate': part 'transliterate' is not in the contract docs/references/slug.md\n    fix: Wire the connection the hop needs, add the part to the contract, or rename what is ambiguous.\n4 unit(s): 3 error(s), 2 warning(s), 0 info  [C1×1, C5×1, G1×1, N1×1, W11×1]<\/code><\/pre>\n<p>The two sides of one connection now name different documents, so they no longer agree on what travels between them (<code>W11<\/code>). The document the need names is a reference, not a contract: it has no parts and no fake (<code>C1<\/code>, <code>C5<\/code>), so the hop of the scenario finds no part <code>transliterate<\/code> in it (<code>N1<\/code>).<\/p><\/li><li><p>Change the contract back to <code>../../docs/references/plugin-api.md<\/code>. Run <code>unifold check<\/code>. It prints <code>0 error(s), 0 warning(s)<\/code>.<\/p><\/li><\/ol>\n<p>You have seen how <code>check<\/code> reports a need without a provider, a connection whose sides name different contracts, and a story that can no longer run. It reads no code: a <code>Cargo.toml<\/code> that uses another crate without a need is for you and your review to notice.<\/p>"}, "docs/tutorials/three-commands.md": {"unit": ".", "kind": "tutorials", "title": "Three commands", "html": "<p>This lesson is for a developer who has cloned the unifold repository and wants to see what the reference tool says about a project. You follow one unit, the plug-in <code>unicode<\/code>, through three commands. Work in the folder <code>examples/slugline<\/code>, with <code>unifold<\/code> set as the alias from <a href=\"#.\">README.md<\/a>.<\/p>\n<ol><li><p>Run <code>unifold check<\/code>. It prints one line:<\/p>\n<pre><code class=\"language-console\">$ unifold check\n4 unit(s): 0 error(s), 0 warning(s), 0 info<\/code><\/pre>\n<p>The map is consistent: every need of the four units is wired, and both sides of each connection name the same contract.<\/p><\/li><li><p>Run <code>unifold show plugins/unicode<\/code>. It prints the unit, its responsibility and kind, what it does not do, its capability and its need, and the scenario that passes through it:<\/p>\n<pre><code class=\"language-console\">$ unifold show plugins/unicode\nunit      unicode  (plugins/unicode)\ndoes      Transliterates Latin letters with diacritics to ASCII\nstatus    active · kind logic\nnot       the rules of a slug; it answers one character at a time\nmanifest  plugins/unicode/unifold.yaml\nparent    slugline\nchildren  none\ncapabilities\n  transliteration (library): Replaces Latin letters that have diacritics, and ligatures, by ASCII letters  contract docs/references/transliteration.md\n      used by cli as need 'transliteration'\nneeds\n  plugin-api (library): The trait a transliteration plug-in implements  contract docs/references/plugin-api.md\n      provided by core capability 'plugin-api'\nscenario  slug-from-arguments: The command turns its arguments into one slug with the plug-in  (held by the root)\nfiles     plugins/unicode/README.md<\/code><\/pre>\n<p>Find the two indented lines: <code>cli<\/code> uses the capability, and <code>core<\/code> provides the need. The last line names the scenario of the root whose hops pass through this unit; its generated diagram is <code>docs/diagrams/scenario-slug-from-arguments.md<\/code>.<\/p><\/li><li><p>Run <code>unifold capability plugins/unicode plugin-api<\/code>. It prints both ends of that one connection:<\/p>\n<pre><code class=\"language-console\">$ unifold capability plugins/unicode plugin-api\n--- plugins/unicode needs 'plugin-api' (library): The trait a transliteration plug-in implements\n    contract: docs/references/plugin-api.md\n    (no section for it in README.md)\n\n--- core capabilities 'plugin-api' (library): The trait a transliteration plug-in implements\n    contract: docs/references/plugin-api.md\n    (no section for it in README.md)<\/code><\/pre>\n<p>Both ends name the same contract, <code>docs/references/plugin-api.md<\/code>. Neither <code>README.md<\/code> has a section for the entry: the summary and the contract say everything, so the command would print the section only where one adds to them.<\/p><\/li><\/ol>\n<p>You have read the map of slugline without opening a manifest. Next, <a href=\"#.@doc:docs/tutorials/break-the-map.md\">break the map<\/a>.<\/p>"}, "AGENTS.md": {"unit": ".", "kind": "other", "title": "AGENTS.md: slugline", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#.\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>\n<h2 id=\"md-documents\">Documents<\/h2>\n<div class=\"table\"><table><thead><tr><th>Kind<\/th><th>Files<\/th><\/tr><\/thead><tbody><tr><td>Learn<\/td><td><a href=\"#.@doc:docs/tutorials/break-the-map.md\">break-the-map<\/a>, <a href=\"#.@doc:docs/tutorials/three-commands.md\">three-commands<\/a><\/td><\/tr><tr><td>Look up<\/td><td><a href=\"#.@doc:docs/references/plugin-api.md\">plugin-api<\/a>, <a href=\"#.@doc:docs/references/slug.md\">slug<\/a>, <a href=\"#.@doc:docs/references/slugify.md\">slugify<\/a>, <a href=\"#.@doc:docs/references/slugline-command.md\">slugline-command<\/a>, <a href=\"#.@doc:docs/references/transliteration.md\">transliteration<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"md-unifold\">unifold<\/h2>\n<p>This repository has a <a href=\"https://unifold.md\">unifold<\/a> map. A folder with a <code>unifold.yaml<\/code> is a unit: the file says what the unit provides and needs, and the unit above connects needs to providers. Read the map before you change an interface; keep it true after.<\/p>\n<ul><li><code>unifold show PATH<\/code>: a unit, its capabilities and needs, and who is on the other side<\/li><li><code>unifold capability PATH NAME<\/code>: both ends of one connection, with contracts<\/li><li><code>unifold check<\/code>: is the map consistent (<code>--fix<\/code> rewrites generated files)<\/li><\/ul>\n<div class=\"table\"><table><thead><tr><th>Unit<\/th><th>Path<\/th><th>Responsibility<\/th><\/tr><\/thead><tbody><tr><td>cli<\/td><td><code>cli<\/code><\/td><td>The slugline command<\/td><\/tr><tr><td>core<\/td><td><code>core<\/code><\/td><td>Makes slugs and defines what a transliteration plug-in must provide<\/td><\/tr><tr><td>unicode<\/td><td><code>plugins/unicode<\/code><\/td><td>Transliterates Latin letters with diacritics to ASCII<\/td><\/tr><\/tbody><\/table><\/div>"}, "cli/README.md": {"unit": "cli", "kind": "readme", "title": "cli", "html": "<p>The <code>slugline<\/code> command: it prints its arguments as one slug, or one slug for each line of standard input. It is the thin shell around the library for people who work in a terminal or a script.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>A command is the cheapest way to try the library and to use it from a shell pipeline. The crate holds only argument parsing and input handling, so that every rule about what a slug looks like stays in one place, the library it depends on. The command, not the library, needs the transliteration plug-in: it is the one place that knows which letters its users type.<\/p>", "intro": "The <code>slugline<\/code> command: it prints its arguments as one slug, or one slug for each line of standard input. It is the thin shell around the library for people who work in a terminal or a script.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>A command is the cheapest way to try the library and to use it from a shell pipeline. The crate holds only argument parsing and input handling, so that every rule about what a slug looks like stays in one place, the library it depends on. The command, not the library, needs the transliteration plug-in: it is the one place that knows which letters its users type.<\/p>"}, "cli/AGENTS.md": {"unit": "cli", "kind": "other", "title": "AGENTS.md: cli", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#cli\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>"}, "core/README.md": {"unit": "core", "kind": "readme", "title": "core", "html": "<p>Turns text into a URL slug and defines the interface of a transliteration plug-in.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>Everything that decides what a slug looks like is in this crate, so the <a href=\"#core@doc:docs/explanation/context.md\">format<\/a> can break in one place only. Character tables are large and a matter of taste: they stay outside, behind a trait (<a href=\"#core@doc:docs/decisions/0001-a-plug-in-is-passed-with-each-call.md\">decision 0001<\/a>).<\/p>", "intro": "Turns text into a URL slug and defines the interface of a transliteration plug-in.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>Everything that decides what a slug looks like is in this crate, so the <a href=\"#core@doc:docs/explanation/context.md\">format<\/a> can break in one place only. Character tables are large and a matter of taste: they stay outside, behind a trait (<a href=\"#core@doc:docs/decisions/0001-a-plug-in-is-passed-with-each-call.md\">decision 0001<\/a>).<\/p>"}, "core/docs/decisions/0001-a-plug-in-is-passed-with-each-call.md": {"unit": "core", "kind": "decisions", "title": "A plug-in is passed with each call", "html": "<h2 id=\"md-context-and-problem-statement\">Context and Problem Statement<\/h2>\n<p><code>slugify<\/code> must replace <code>é<\/code> by <code>e<\/code> without holding the tables. How does a table reach it?<\/p>\n<h2 id=\"md-considered-options\">Considered Options<\/h2>\n<ul><li>An argument <code>&amp;dyn Transliterate<\/code><\/li><li>A global registry of plug-ins<\/li><li>A Cargo feature that pulls in a table<\/li><\/ul>\n<h2 id=\"md-decision-outcome\">Decision Outcome<\/h2>\n<p>Chosen option: &quot;An argument <code>&amp;dyn Transliterate<\/code>&quot;, because the result then depends on the arguments alone.<\/p>\n<h3 id=\"md-consequences\">Consequences<\/h3>\n<ul><li>Good: two callers in one process can use different plug-ins.<\/li><li>Bad: every caller passes a plug-in itself.<\/li><\/ul>", "status": "accepted", "facts": [["status", "<span class=\"badge accepted\">accepted<\/span>"], ["date", "2026-10-22"], ["decision makers", "Alexander Walter &lt;alexander@wackazong.com&gt;"]]}, "core/docs/decisions/index.md": {"unit": "core", "kind": "decisions", "title": "Decisions of core", "html": "<p><a href=\"#core\">README.md<\/a> · <a href=\"#core@doc:AGENTS.md\">AGENTS.md<\/a><\/p>\n<p>Accepted and derived decisions bind.<\/p>\n<div class=\"table\"><table><thead><tr><th>No.<\/th><th>Decision<\/th><th>Status<\/th><th>Date<\/th><\/tr><\/thead><tbody><tr><td>0001<\/td><td><a href=\"#core@doc:docs/decisions/0001-a-plug-in-is-passed-with-each-call.md\">A plug-in is passed with each call<\/a><\/td><td>accepted<\/td><td>2026-10-22<\/td><\/tr><\/tbody><\/table><\/div>"}, "core/docs/explanation/context.md": {"unit": "core", "kind": "explanation", "title": "Context of core", "html": "<p>What this unit inherits from the units above. This is the only file of the unit that links upward. Each item is restated so that the unit can be understood when the link is not available.<\/p>\n<h2 id=\"md-from-slugline\">From slugline<\/h2>\n<h3 id=\"md-slugline-the-format-of-a-slug\"><a href=\"#.@doc:docs/references/slug.md#format\">slugline: the format of a slug<\/a><\/h3>\n<p>Says: a slug has only <code>a-z<\/code>, <code>0-9<\/code> and one separator character: exactly one between two words, none at the start or the end. It may be empty.<\/p>\n<p>Here: <code>slugify<\/code> and <code>slugify_with<\/code> return nothing else.<\/p>"}, "core/docs/explanation/invariants.md": {"unit": "core", "kind": "explanation", "title": "Invariants of core", "html": "<p>What holds in this crate at every moment.<\/p>\n<ul><li>No dependencies.<\/li><li>Each guarantee in <a href=\"#core\">README.md<\/a> has a test in <code>tests/<\/code>.<\/li><\/ul>"}, "core/AGENTS.md": {"unit": "core", "kind": "other", "title": "AGENTS.md: core", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#core\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>\n<h2 id=\"md-documents\">Documents<\/h2>\n<div class=\"table\"><table><thead><tr><th>Kind<\/th><th>Files<\/th><\/tr><\/thead><tbody><tr><td>Understand<\/td><td><a href=\"#core@doc:docs/explanation/context.md\">context<\/a>, <a href=\"#core@doc:docs/explanation/invariants.md\">invariants<\/a>, <a href=\"#core@doc:docs/decisions/index.md\">decisions<\/a><\/td><\/tr><\/tbody><\/table><\/div>"}, "plugins/unicode/README.md": {"unit": "plugins/unicode", "kind": "readme", "title": "unicode", "html": "<p>A transliteration plug-in: it replaces Latin letters that have diacritics, and ligatures such as <code>æ<\/code>, by ASCII letters, so that a slug of <code>Crème brûlée<\/code> keeps its letters instead of losing them.<\/p>\n<h2 id=\"md-why\">Why<\/h2>\n<p>Character tables are large and a matter of taste, so they live outside the library that makes slugs, behind the trait that library defines. This crate is one such table, for Latin script. Another script is another plug-in, not a change here, and a user who wants no transliteration leaves this crate out.<\/p>", "intro": "A transliteration plug-in: it replaces Latin letters that have diacritics, and ligatures such as <code>æ<\/code>, by ASCII letters, so that a slug of <code>Crème brûlée<\/code> keeps its letters instead of losing them.", "why": "<h2 id=\"md-why\">Why<\/h2>\n<p>Character tables are large and a matter of taste, so they live outside the library that makes slugs, behind the trait that library defines. This crate is one such table, for Latin script. Another script is another plug-in, not a change here, and a user who wants no transliteration leaves this crate out.<\/p>"}, "plugins/unicode/AGENTS.md": {"unit": "plugins/unicode", "kind": "other", "title": "AGENTS.md: unicode", "html": "<p>unifold unit; run <code>unifold show<\/code> here. Read <a href=\"#plugins/unicode\">README.md<\/a> first: it says what the unit is for and why it is built this way. Everything else is in <code>docs/<\/code>.<\/p>"}}, "base": "", "up": ""};
const MERMAID = {"url": "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"};
const units = model.units, byPath = Object.fromEntries(units.map(u => [u.path, u]));
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const file = p => model.base ? model.base + "/" + p.split("/").map(encodeURIComponent).join("/") : model.up + p.split("/").map(encodeURIComponent).join("/");
const badge = s => s && s !== "active" && s !== "accepted" ? ` <span class="badge ${esc(s.split(" ")[0])}">${esc(s)}</span>` : "";
const pick = (p, t) => `<a class="go" data-path="${esc(p)}">${esc(t ?? (p === "." ? model.name : p))}</a>` + badge(byPath[p] && byPath[p].status);
const docs = model.docs || {}, KINDS = {readme: "README", tutorials: "Tutorials", contracts: "Contracts", references: "Reference", explanation: "Explanation", decisions: "Decisions", skills: "Skills", other: "Other"};
const enc = s => encodeURIComponent(s).replace(/%(2F|40|3A)/g, m => decodeURIComponent(m));   // a route stays readable: unit@doc:docs/references/x.md
const hashOf = (route, anchor) => "#" + enc(route) + (anchor ? "#" + encodeURIComponent(anchor) : "");
const pageOf = p => { const d = docs[p]; return d && d.unit + "@doc:" + (d.unit === "." ? p : p.slice(d.unit.length + 1)); };   // the page of a document
const routeOf = p => docs[p] && docs[p].kind === "readme" ? docs[p].unit : pageOf(p);   // a link to a README opens its unit
const href = v => { const [p, a] = v.split("#"), r = routeOf(p); return r ? hashOf(r, a) : file(p) + (a ? "#" + encodeURIComponent(a) : ""); };   // a document opens here, any other file as it is
const ref = v => v ? (/^[a-z][a-z0-9+.-]*:/i.test(v) ? `<a href="${esc(v)}">${esc(v)}</a>` : `<a href="${esc(href(v))}">${esc(v)}</a>`) : "";
const part = (contract, name) => { const dir = contract.endsWith("/index.md") && contract.slice(0, -8) + name + ".md";   // a part: its file in a folder contract, its heading in a file
  return `<a href="${esc(href(dir && docs[dir] ? dir : contract + "#" + name))}">${esc(name)}</a>`; };
const title = p => docs[p].title || esc(p.split("/").pop().replace(/\.md$/, ""));
const uses = {};                      // contract path -> part -> [[scenario, step]]: the steps of the stories that use the part
for (const s of (model.scenarios || [])) s.hops.forEach((x, i) => { if (x.contract) ((uses[x.contract] ||= {})[x.part] ||= []).push([s, i + 1]); });
const partsOf = {};                   // contract path -> its parts with their kinds, from the manifests that name it
for (const u of units) for (const e of Object.values(u.capabilities).concat(Object.values(u.needs))) if (e.contract && e["contract-parts"]) partsOf[e.contract] = e["contract-parts"];
const usedIn = (contract, name) => {  // the stories that use a part, with their steps; or the word that none does
  const by = new Map(); for (const [s, n] of (uses[contract] || {})[name] || []) by.set(s, (by.get(s) || []).concat(n));
  return by.size ? [...by].map(([s, ns]) => sceneLink(s) + ` <span class="mute">step ${ns.join(", ")}</span>`).join("<br>") : `<span class="mute">no scenario uses this part</span>`; };
const plain = h => { const t = document.createElement("template"); t.innerHTML = h; return t.content.textContent; };
const docLink = (p, on) => on ? `<li class="on">${title(p)}</li>` : `<li><a href="${esc(href(p))}">${title(p)}</a>` + (docs[p].kind === "decisions" ? badge(docs[p].status || "no status") : "")
  + (docs[p].kind === "skills" && docs[p].summary ? ": " + esc(docs[p].summary) : "") + "</li>";
function groups(u){                  // the documents of a unit by kind, in the order of AGENTS.md: learn, look up, understand, decide, do
  const of = {tutorials: u.documents.tutorials, contracts: u.documents.references.filter(p => partsOf[p]), references: u.documents.references.filter(p => !partsOf[p]),   // a reference that a manifest names is a contract
    explanation: u.documents.explanation, decisions: u.decisions.map(d => d.path),
    skills: u.skills.map(s => s.path), other: Object.keys(docs).filter(p => docs[p].unit === u.path && docs[p].kind === "other")};
  return Object.entries(KINDS).map(([k, label]) => [k, label, (of[k] || []).filter(p => docs[p])]).filter(g => g[2].length);}
function anchors(box, route){        // the link beside a heading; the ids come with the document
  for (const h of box.querySelectorAll(":is(h2,h3,h4,h5,h6)[id^='md-']")) h.insertAdjacentHTML("beforeend", ` <a class="anchor" href="${esc(hashOf(route, h.id.slice(3)))}" aria-label="Link to this section">#</a>`);}
let figure = 0;
async function figures(box){         // the Mermaid blocks of a document, drawn like the map; without Mermaid they stay source
  if (!mermaid) return;
  for (const pre of [...box.querySelectorAll("pre.mermaid")]) {
    try { const {svg} = await mermaid.render("f" + ++figure, pre.textContent); if (!pre.isConnected) return;
      const f = document.createElement("div"); f.className = "figure"; f.innerHTML = svg; pre.replaceWith(f);
    } catch (err) { if (pre.isConnected) pre.title = "The diagram could not be drawn: " + err; }
  }
}
function seek(anchor){const t = anchor && document.getElementById("md-" + anchor); if (t) t.scrollIntoView();}
let mermaid = null, mermaidError = null, fit = null, fitted = false, state = {path: ".", kind: null}, row = null;
function shade(){                    // a framing box is shaded by how deep it sits; its name moves to its top left
  const clusters = [...el("diagram").querySelectorAll(".cluster")].map(c => [c, c.querySelector(":scope > rect").getBoundingClientRect()]);
  for (const [c, r] of clusters) c.dataset.depth = Math.min(2, clusters.filter(([o, b]) => o !== c && b.left <= r.left && b.right >= r.right && b.top <= r.top && b.bottom >= r.bottom).length);
  for (const [c] of clusters) {      // the name of a framing box: top left, drawn above the boxes inside it, which start only 20px lower
    const rect = c.querySelector(":scope > rect"), name = c.querySelector(":scope > .cluster-label");
    if (!name) continue;
    name.setAttribute("transform", `translate(${+rect.getAttribute("x") + 16}, ${+rect.getAttribute("y") + 8})`);
    name.style.setProperty("--halo", getComputedStyle(rect).fill); name.dataset.frame = c.id; c.parentNode.appendChild(name);
  }
}
function zoom(map){const box = el("diagram"), svg = box.querySelector("svg"), b = el("zoom");
  box.classList.remove("fit"); const room = box.clientWidth - 24, width = svg ? svg.getBoundingClientRect().width : 0;
  const wide = width > room; fitted = wide && (fit ?? (map || width <= room * 1.45));   // a map opens fitted; a scenario: a little too wide shrinks, much too wide scrolls; a choice with the button holds
  b.hidden = !wide; box.classList.toggle("fit", fitted);
  b.textContent = fitted ? "Full size" : "Fit to width"; box.scrollLeft = 0;}
const scenes = model.scenarios || [], scene = (p, n) => scenes.find(s => s.unit === p && s.name === n);
const decode = s => { try { return decodeURIComponent(s); } catch { return s; } };
function fromHash(){const raw = location.hash.slice(1), cut = raw.indexOf("#");   // unit@kind, holder@scenario:name or unit@doc:path, then #anchor
  const h = decode(cut < 0 ? raw : raw.slice(0, cut)), at = h.indexOf("@"), p = at < 0 ? h : h.slice(0, at), k = at < 0 ? "" : h.slice(at + 1);
  const sv = k.startsWith("scenario:") ? k.slice(9).split(":") : [], s = sv.length ? scene(p, sv[0]) : null, d = k.startsWith("doc:") ? (p === "." ? "" : p + "/") + k.slice(4) : null;
  state = {path: byPath[p] ? p : ".", kind: s || d || !k ? null : k, scenario: s, view: sv[1] || null, doc: d && docs[d] ? d : null, anchor: cut < 0 ? "" : decode(raw.slice(cut + 1))};}
function go(path, kind){location.hash = enc(path + (kind ? "@" + kind : ""));}
function tree(path){const u = byPath[path]; const kids = u.children.map(c => tree(c.path)).join("");
  return `<li><a data-path="${esc(path)}" class="go${path === state.path && !state.scenario ? " on" : ""}">${esc(u.name)}${u.status !== "active" ? `<span class="st ${esc(u.status)}" title="${esc(u.status)}"></span>` : ""}</a>${kids ? "<ul>" + kids + "</ul>" : ""}</li>`;}
const named = p => p === "." ? model.name : p;
const pin = (p, t) => { const st = byPath[p].status; return `<span class="nw"><a class="go" data-path="${esc(p)}">${esc(t ?? named(p))}</a>` + (st !== "active" ? `<span class="st ${esc(st)}" title="${esc(st)}"></span>` : "") + "</span>"; };   // the status as in the tree
function docTree(u){                 // the documents of the unit shown, beside the map
  const g = groups(u); if (!g.length) return "";
  return `<div class="docs"><p class="navhead">Documents of ${esc(u.name)}</p>` + g.map(([k, label, paths]) => `<p class="holder">${label}</p><ul>`
    + paths.map(p => `<li><a href="${esc(href(p))}"${p === state.doc || (state.doc && docs[state.doc].contract === p) ? ' class="on"' : ""}>${title(p)}</a></li>`).join("") + "</ul>").join("") + "</div>";}
function map(on){for (const id of ["bar", "diagram", "shared", "hint"]) el(id).hidden = !on;}
const sceneLink = (s, t) => `<a class="go" data-path="${esc(s.unit)}" data-scenario="${esc(s.name)}">${t ?? esc(s.name)}</a>`;
function sceneTree(){                // every scenario of the project, under the unit that holds it when there are several
  const holders = [...new Set(scenes.map(s => s.unit))];
  return scenes.length ? "<p class='navhead'>Scenarios</p>" + holders.map(h => (holders.length > 1 ? `<p class="holder">${esc(named(h))}</p>` : "")
    + "<ul>" + scenes.filter(s => s.unit === h).map(s => `<li><a class="go${s === state.scenario ? " on" : ""}" data-path="${esc(s.unit)}" data-scenario="${esc(s.name)}" title="${esc(s.summary)}">${esc(s.name)}</a></li>`).join("") + "</ul>").join("") : "";}
const legend = ["planned", "deprecated"].filter(s => units.some(u => u.status === s))
  .map(s => `<span class="st ${s}"></span>${s}`).join(" &nbsp; ");
function note(i){return i.config ? " <span class='mute'>(" + esc(i.config) + ")</span>" : "";}
function who(list, key){return list.map(i => i.outside ? "outside the project" + note(i)
  : pick(i.unit) + " · <code>" + esc(i[key]) + "</code>" + note(i)).join("<br>") || "–";}
function code(text){return esc(text).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/^- /, "");}
async function render(){
  const u = byPath[state.path]; const kinds = Object.keys(u.diagrams);
  run++; el("play").hidden = true; el("strip").hidden = true;
  const kind = kinds.includes(state.kind) ? state.kind : (kinds.includes("component") ? "component" : kinds[0]);
  el("tree").innerHTML = "<ul>" + tree(".") + "</ul>" + docTree(u) + sceneTree() + (legend ? `<p class="legend">${legend}</p>` : "");
  const chain = []; for (let p = u.parent; p; p = byPath[p.path].parent) chain.unshift(p.path);
  if (state.doc) return reading(state.doc, chain);
  map(true);
  if (state.scenario) return story(state.scenario, chain);
  el("facts").hidden = true; el("hint").textContent = "Click a box to open that unit, a capability or need to find it in the tables. An arrow points from a need to its provider. A dashed border marks a unit that is planned.";
  document.title = u.name + " · " + model.name;
  el("crumbs").innerHTML = chain.map(p => `<a class="go" data-path="${esc(p)}">${esc(byPath[p].name)}</a>`).concat(esc(u.name)).join(" / ");
  const readme = u.readme && docs[u.readme];   // the README: its first paragraph on top (the responsibility is in the boxes of the diagram), its Why above the tables
  el("title").innerHTML = esc(u.name) + badge(u.status); el("summary").innerHTML = readme && readme.intro || esc(u.responsibility);
  el("meta").innerHTML = [u.kind, u.owner && "owner " + u.owner].filter(Boolean).map(esc)
    .concat([`<a href="${esc(file(u.manifest))}">manifest</a>`], u.readme ? [`<a href="${esc(readme ? hashOf(pageOf(u.readme)) : file(u.readme))}">README</a>`] : [],
            u.agents ? [`<a href="${esc(href(u.agents))}">AGENTS.md</a>`] : []).join(" · ");
  el("doc").hidden = true;
  el("tabs").innerHTML = kinds.map(k => `<button data-kind="${k}" class="${k === kind ? "on" : ""}">${k}</button>`).join("");
  let html = readme && readme.why ? `<div class="prose wide">${readme.why}</div>` : "";   // Why, then what the unit leaves out, as sections of the same rank
  const p = Object.entries(u.capabilities), n = Object.entries(u.needs);

  const a = ev.target.closest(".go");
  if (a) { row = a.dataset.row || null;   // a capability or need of the holder of a scenario: its row in the tables
    if (a.dataset.scenario) go(a.dataset.path, "scenario:" + a.dataset.scenario);
    else if (row && a.dataset.path === state.path && !state.scenario && !state.doc) render(); else go(a.dataset.path);
    return; }
  const b = ev.target.closest("button[data-kind]"); if (b) go(state.path, b.dataset.kind);
  const v = ev.target.closest("button[data-view]"); if (v && state.scenario) go(state.path, "scenario:" + state.scenario.name + (v.dataset.view === "map" ? ":map" : ""));
  if (ev.target.id === "zoom") { fit = !fitted; zoom(); dispatchEvent(new Event("resize")); }   // a running story maps its dot anew
});
addEventListener("hashchange", () => { const was = state, top = !row; fromHash(); render();
  const main = document.querySelector("main");   // another page: from its top, unless a row or a heading is to be shown
  if (state.anchor) seek(state.anchor);
  else if (top && (was.path !== state.path || was.scenario !== state.scenario || was.doc !== state.doc) && main.getBoundingClientRect().top < 0) main.scrollIntoView(); });
async function loadMermaid(){
  if (window.mermaid) return window.mermaid;
  if (!MERMAID.url) throw new Error("no renderer");
  if (/\.mjs(\?|$)/.test(MERMAID.url)) return (await import(MERMAID.url)).default;
  await new Promise((ok, fail) => { const s = document.createElement("script"); s.src = MERMAID.url;
    s.onload = ok; s.onerror = () => fail(new Error("not loaded")); document.head.appendChild(s); });
  return window.mermaid;
}
fromHash(); render(); seek(state.anchor);
function setup(){   // the renderer; set up again when light or dark changes

    flowchart: {useMaxWidth: false, curve: "basis", padding: 8, nodeSpacing: 28, rankSpacing: 60,
      subGraphTitleMargin: {top: 10, bottom: 18}},   // room for the large name of a framing unit above its content
    sequence: {useMaxWidth: false, width: 120, actorMargin: 36, boxMargin: 12, messageMargin: 44, noteMargin: 12,   // a scenario
      actorFontSize: 14, actorFontWeight: 500, messageFontSize: 14, messageFontWeight: 500, noteFontSize: 14, noteAlign: "left"},
    theme: "base", themeVariables: {fontFamily: getComputedStyle(document.body).getPropertyValue("--sans"), fontSize: "16px",
      darkMode: getComputedStyle(document.documentElement).colorScheme === "dark"}});   // dark as the style sheet has it: by the button or by the system
}
try {
  mermaid = await loadMermaid();
  setup();
} catch (err) { mermaid = null; mermaidError = err; }
render();
addEventListener("themechange", () => { if (mermaid) { setup(); render(); } });   // light or dark changed: draw again in the new colours
