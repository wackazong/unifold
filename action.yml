name: unifold check
description: Check the unifold architecture map of a repository and put the findings on the pull request.
author: the unifold authors
branding:
  icon: git-merge
  color: blue
inputs:
  path:
    description: A folder inside the unifold project.
    default: "."
  strict:
    description: Set to "true" to fail on warnings too.
    default: "false"
  args:
    description: Further arguments for `unifold check`, for example "--quiet" or "--rule W2".
    default: ""
  python-version:
    description: Python version to run the tool with (3.9 or newer).
    default: "3.x"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install PyYAML
      shell: bash
      run: python -m pip install --quiet "pyyaml>=6"
    - name: unifold check
      shell: bash
      env:
        UNIFOLD_PATH: ${{ inputs.path }}
        UNIFOLD_STRICT: ${{ inputs.strict }}
        UNIFOLD_ARGS: ${{ inputs.args }}
      run: |
        strict=""
        if [ "$UNIFOLD_STRICT" = "true" ]; then strict="--strict"; fi
        # shellcheck disable=SC2086
        python "$GITHUB_ACTION_PATH/docs/skills/unifold/scripts/unifold.py" \
          check --format github $strict $UNIFOLD_ARGS "$UNIFOLD_PATH"
