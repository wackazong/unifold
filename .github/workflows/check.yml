# Runs on every push and pull request what CONTRIBUTING.md asks a contributor to run.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tool:
    name: tool and examples, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04   # ubuntu-latest is 26.04, for which setup-python has no 3.9 build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]   # the oldest version the tool supports, and the newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Conformance tests
        run: uv run tests/conformance.py
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Check the examples
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          uv run docs/skills/unifold/scripts/unifold.py check --strict examples/slugline
          uv run docs/skills/unifold/scripts/unifold.py check --strict examples/serial-line
          uv run docs/skills/unifold/scripts/unifold.py check --strict examples/plantwatch

  action:
    name: the GitHub Action on an example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: examples/slugline
          strict: "true"

  site:
    name: site build and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the site and check its links
        run: uv run site/build.py --check
