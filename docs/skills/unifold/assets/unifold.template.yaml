# yaml-language-server: $schema=https://unifold.md/0.2/unifold.schema.json
# Manifest of a unit. The folder name is the unit's name. Only 'summary' is
# required; delete what you do not need. Standard: https://unifold.md/spec
summary: <what the unit is, in one line>
# unifold: "0.2"         # root only: the version of the standard
# name: <project-name>   # root only, and every root should set it; default: the folder name
# status: planned        # planned | active (default) | deprecated
# kind: <library | service | app | adapter | ...>
# owner: <team or person>
capabilities:
  <capability-name>: <what the capability provides, in one line>
  <other-capability>:
    summary: <what the capability provides, in one line>
    kind: <library | http | events | cli | ...>
    contract: ../docs/references/<topic>.md   # the reference of the parent that defines the connection
    verified-by: <path or URL of the tests that check it>
needs:
  <need-name>: <what this unit expects from whoever provides it>
  <other-need>:
    summary: <what this unit expects from whoever provides it>
    optional: true       # the need may stay unconnected
wiring:                  # only in a unit that has child units; every connection is a line
  <child>.<need>: <other-child>.<capability>   # a sibling meets the need of a child
  <child>.<need>: <own-need>                    # passed up to a need of this unit
  <own-need>: <child>.<capability>              # a child meets a need of this unit's own code
  <own-capability>: <child>.<capability>        # a child implements a capability of this unit
  <child>.<need>:                     # named alternatives; the first is the default
    <name>: <child>.<capability>
    <other-name>: <other-child>.<capability>
