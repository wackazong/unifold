# yaml-language-server: $schema=https://unifold.md/0.1/unifold.schema.json
unifold: "0.1"
name: unifold
level: full
summary: A standard for declaring what each folder of a repository provides and needs, with a skill for agents and a tool that checks and draws the result
kind: specification
status: active
owner: the unifold authors
capabilities:
  specification:
    kind: specification
    summary: The standard on one page, with a guide and a JSON Schema for the manifest
    contract: docs/references/unifold/spec.md
    verified-by: tests/conformance.py
  skill:
    kind: skill
    summary: Agent Skills that teach an agent to convert a repository to unifold and to read, change and check a unifold project
    contract: docs/skills/unifold/SKILL.md
  tool:
    kind: cli
    summary: Reference tool that checks manifests, compares them with code and generates diagrams
    contract: docs/references/unifold/tool.md
    verified-by: tests/conformance.py
needs:
  python:
    kind: runtime
    summary: Python 3.9 or newer with PyYAML, to run the tool
